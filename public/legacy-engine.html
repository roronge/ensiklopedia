/* ---------- cadangan ---------- */
S.exportBackup = async function (onProgress) {
  if (!S.mk) throw new Error('Ruang keluarga terkunci');
  const db = S.caps.db;
  const parts = [];
  const take = async (coll) => { const q = await dbRetry(() => db.collection(coll).get()); return q.docs.map((d) => ({ id: d.id, data: d.data() })); };
  const fam = await dbRetry(() => db.doc(COLL.family + '/main').get());
  const ch = await take(COLL.children), me = await take(COLL.memories);
  const photoRefs = []; S.memories.forEach((m) => m.photos.forEach((p) => { photoRefs.push(p); if (p.vid) photoRefs.push(p.vid); }));
  S.children.forEach((c) => CoverArt.photosOf(c.cv).forEach((it) => photoRefs.push(it.ph)));
  parts.push('{"app":"ensiklopedia-kenangan","v":1,"exportedAt":' + Date.now() + ',"vid":' + JSON.stringify(S.vault.vid) + ',"family":' + JSON.stringify(fam.data()) + ',"children":' + JSON.stringify(ch) + ',"memories":' + JSON.stringify(me) + ',"photos":[');
  let first = true, done = 0;
  for (const ph of photoRefs) {

};
S.importBackup = async function (text, onProgress) {

  const db = S.caps.db;

/* ===== 31-store-video.js ===== */
/* ===== Penyimpanan video: dipecah, disandikan, dan disimpan di koleksi yang sama dengan foto.
   Video menempel pada sebuah foto (gambar sampulnya): ph.vid = { id, n, b, iv, mime, dur, w, h, rec }. ===== */

const VIDEO_CHUNK = PHOTO_CHUNK;
const VIDEO_POOL = 3;

/** ulangi sampai 4 kali dengan jeda yang makin panjang bila penyimpanan sibuk */
async function vRetry(fn) {
  let last;
  for (let k = 0; k < 4; k++) {
    try { return await fn(); } catch (e) {
      last = e; const c = e && e.code;
      if (c !== 'unavailable' && c !== 'resource_exhausted') throw e;
      await sleep(500 * (k + 1) + Math.random() * 400);
    }
  }
  throw last;
}
/** jalankan fn(i) untuk i = 0..n-1 dengan paling banyak `conc` sekaligus; berhenti pada galat pertama */
async function poolRun(n, conc, fn) {
  let next = 0, failure = null;
  const worker = async () => {
    while (!failure) {
      const i = next++; if (i >= n) return;
      try { await fn(i); } catch (e) { failure = failure || e; return; }
    }
  };
  await Promise.all(Array.from({ length: Math.min(conc, Math.max(1, n)) }, worker));
  if (failure) throw failure;
}

S.isVideo = (ph) => !!(ph && (ph.vid || ph.pv));
S.videoCount = (list) => (list || []).filter(S.isVideo).length;

/* Siapkan video di perangkat: gambar sampul jadi foto biasa, videonya diperiksa dan bila perlu dikecilkan.
   o: { quality, ctl, onStatus(label, 0..1), onNote(text), confirmShrink(info, start) -> Promise<hasil|null> } */
S.prepVideo = async function (file, o) {
  o = o || {};
  const say = o.onStatus || (() => { /* tanpa laporan */ }), ctl = o.ctl || new VIDEO.Ctl();
  const chk = () => { if (ctl.cancelled) throw vErr('cancelled'); };
  if (!VIDEO.isVideoFile(file)) throw vErr('bad_video');
  say('Membaca video', 0.02);
  const src = await VIDEO.open(file);
  let pp = null;
  try {
    chk(); say('Mengambil gambar sampul', 0.06);
    const posterBlob = await VIDEO.poster(src); chk();
    pp = await S.prepPhoto(posterBlob, { side: 1100, q: 0.82 }); chk();
    let blob = file, mime = VIDEO.mimeFor(file), w = src.w, hh = src.h, shrunk = false, hasAudio = true;
    if (!mime || file.size > VIDEO.MAX_BYTES) {
      const tooBig = file.size > VIDEO.MAX_BYTES;
      if (!VIDEO.canShrink()) throw vErr(tooBig ? 'video_too_big' : 'video_unsupported');
      if (src.dur > VIDEO.MAX_ENCODE_SEC) throw vErr('video_too_long');
      const qk = o.quality || lsGet('vq', 'seimbang');
      const start = (k) => {
        const pl = VIDEO.plan(src.dur, src.w, src.h, k);
        if (!pl) return Promise.reject(vErr('video_too_long'));
        return VIDEO.transcode(src, pl, { ctl, onProgress: (f) => say('Mengecilkan video', 0.1 + f * 0.88), onNote: o.onNote });
      };
      say('Menunggu persetujuan', 0.08);
      const info = { name: file.name, size: file.size, dur: src.dur, w: src.w, h: src.h, tooBig, quality: qk };
      const res = await (o.confirmShrink ? o.confirmShrink(info, start) : start(qk));
      if (!res) throw vErr('cancelled');
      chk();
      if (res.blob.size > VIDEO.MAX_BYTES) throw vErr('video_too_big');
      blob = res.blob; mime = res.mime; w = res.w; hh = res.h; shrunk = true; hasAudio = res.hasAudio;
    }
    if (blob === file && String(file.type).split(';')[0] !== mime) blob = new Blob([file], { type: mime });
    pp.pv = { blob, mime, dur: src.dur, w, h: hh, shrunk, hasAudio, from: file.size };
    say('Siap', 1);
    return pp;
  } catch (e) { if (pp) S.dropPrepared(pp); throw e; } finally { src.close(); }
};

/* Unggah video terenkripsi sebagai potongan dokumen. Mengembalikan { id, n, b, iv, mime, dur, w, h, rec }. */
S.commitVideo = async function (pv, onProgress) {
  S.requireWrite();
  const db = S.caps.db, id = uid();
  const bytes = new Uint8Array(await pv.blob.arrayBuffer());
  const ct = await Vault.encBytes(S.mk, bytes, 'photos/' + id);
  const n = Math.ceil(ct.bytes.length / VIDEO_CHUNK), attempted = new Set(); let done = 0;
  try {
    await poolRun(n, VIDEO_POOL, async (i) => {
      attempted.add(i);
      const part = ct.bytes.subarray(i * VIDEO_CHUNK, Math.min(ct.bytes.length, (i + 1) * VIDEO_CHUNK));
      await vRetry(() => db.doc(COLL.photos + '/' + id + '_' + i).set({ v: 1, i, n, d: b64e(part), t: Date.now(), by: S.uid || '' }));
      done++; if (onProgress) onProgress(done / n);
    });
  } catch (e) {
    for (const i of attempted) { try { await db.doc(COLL.photos + '/' + id + '_' + i).delete(); } catch (x) { /* abaikan */ } }
    markDenied(e); throw e;
  }
  return { id, n, b: ct.bytes.length, iv: ct.iv, mime: pv.mime, dur: Math.round(pv.dur * 10) / 10, w: pv.w, h: pv.h, rec: pv.shrunk ? 1 : 0 };
};

/* Unduh dan buka video -> Blob. Hanya dua video terakhir yang disimpan di memori. */
S.videoBlob = function (ph, onProgress) {
  if (ph && ph.pv && !ph.vid) return Promise.resolve(ph.pv.blob); /* belum diunggah */
  const v = ph && ph.vid; if (!v) return Promise.reject(vErr('video_missing'));
  let e = S._vidCache.get(v.id);
  if (e) { if (onProgress) { e.subs.add(onProgress); if (e.last != null) onProgress(e.last); } return e.p; }
  e = { subs: new Set(onProgress ? [onProgress] : []), last: null, p: null };
  const db = S.caps.db, parts = new Array(v.n); let done = 0;
  e.p = (async () => {
    await poolRun(v.n, VIDEO_POOL + 1, async (i) => {
      const snap = await vRetry(() => db.doc(COLL.photos + '/' + v.id + '_' + i).get());
      if (!snap.exists) throw vErr('video_missing');
      parts[i] = b64d(snap.data().d);
      done++; e.last = done / v.n; e.subs.forEach((f) => { try { f(e.last); } catch (x) { /* abaikan */ } });
    });
    let tot = 0; parts.forEach((x) => { tot += x.length; });
    const all = new Uint8Array(tot); let off = 0; parts.forEach((x) => { all.set(x, off); off += x.length; });
    const pt = await Vault.decBytes(S.mk, v.iv, all, 'photos/' + v.id);
    e.subs.clear();
    return new Blob([pt], { type: String(v.mime).split(';')[0] });
  })();
  e.p.catch(() => { if (S._vidCache.get(v.id) === e) S._vidCache.delete(v.id); });
  S._vidCache.set(v.id, e);
  while (S._vidCache.size > 2) { const k = S._vidCache.keys().next().value; if (k === v.id) break; S._vidCache.delete(k); }
  return e.p;
};
S.videoURL = async function (ph, onProgress) {
  const key = ph.vid ? ph.vid.id : ph.id;
  const have = S._vidUrls.get(key); if (have) return have;
  const blob = await S.videoBlob(ph, onProgress);
  let u = S._vidUrls.get(key); if (u) return u;
  u = URL.createObjectURL(blob); S._vidUrls.set(key, u);
  while (S._vidUrls.size > 3) {
    const k = S._vidUrls.keys().next().value; if (k === key) break;
    const old = S._vidUrls.get(k); S._vidUrls.delete(k);
    setTimeout(() => { try { URL.revokeObjectURL(old); } catch (x) { /* abaikan */ } }, 30000);
  }
  return u;
};
S.deleteVideoDocs = async function (v) {
  const db = S.caps.db;
  try { await poolRun(v.n || 0, VIDEO_POOL + 1, async (i) => { try { await vRetry(() => db.doc(COLL.photos + '/' + v.id + '_' + i).delete()); } catch (e) { markDenied(e); } }); } catch (e) { /* abaikan */ }
  S._vidCache.delete(v.id);
  const u = S._vidUrls.get(v.id); if (u) { try { URL.revokeObjectURL(u); } catch (e) { /* abaikan */ } S._vidUrls.delete(v.id); }
};
/* video yang belum diunggah: lepaskan alamat sementaranya bersama fotonya */
const dropPreparedPhoto = S.dropPrepared;
S.dropPrepared = function (pp) {
  if (pp && pp.pv) { const u = S._vidUrls.get(pp.id); if (u) { try { URL.revokeObjectURL(u); } catch (e) { /* abaikan */ } S._vidUrls.delete(pp.id); } }
  return dropPreparedPhoto(pp);
};


/* ===== 32-video.js ===== */
/* ===== Video: membaca berkas video di perangkat ini, mengambil gambar sampul, dan bila terlalu besar
   mengecilkannya sebelum disandikan dan diunggah. Tidak ada yang dikirim ke mana pun selama proses ini. ===== */

const VIDEO = {
  MAX_BYTES: 16 * 1024 * 1024, /* ukuran video yang disimpan (16 MB), sebelum disandikan */
  MAX_ENCODE_SEC: 180, /* video yang lebih panjang dari ini tidak dikecilkan di perangkat */
  MAX_PER_MEMORY: 3,
  QUALITY: [
    { k: 'hemat', label: 'Hemat ruang', note: '480p', side: 854, vbps: 900000 },
    { k: 'seimbang', label: 'Seimbang', note: '720p', side: 1280, vbps: 2200000 },
    { k: 'tajam', label: 'Tajam', note: '1080p', side: 1920, vbps: 4000000 },
  ],
};
const vErr = (code, msg) => Object.assign(new Error(msg || code), { code });

VIDEO.isVideoFile = (f) => !!f && (/^video\//i.test(f.type || '') || /\.(mp4|m4v|mov|webm|mkv|3gp|3g2|avi|mpe?g|ogv|wmv)$/i.test(f.name || ''));
/** jenis berkas yang aman diputar di hampir semua peramban; selain itu perlu diubah dulu */
VIDEO.mimeFor = function (f) {
  const t = String((f && f.type) || '').toLowerCase().split(';')[0];
  if (t === 'video/mp4' || t === 'video/webm') return t;
  const m = /\.([a-z0-9]+)$/i.exec((f && f.name) || ''), e = m ? m[1].toLowerCase() : '';
  return e === 'mp4' || e === 'm4v' ? 'video/mp4' : e === 'webm' ? 'video/webm' : '';
};
VIDEO.fmtDur = function (s) {
  s = Math.max(0, Math.round(s || 0));
  const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
  return (hh ? hh + ':' + String(mm).padStart(2, '0') : String(mm)) + ':' + String(ss).padStart(2, '0');
};
/** "1 menit 12 detik" untuk kalimat */
VIDEO.durWords = function (s) {
  s = Math.max(1, Math.round(s || 0));
  const mm = Math.floor(s / 60), ss = s % 60;
  return mm ? mm + ' menit' + (ss ? ' ' + ss + ' detik' : '') : ss + ' detik';
};

/** pegangan untuk membatalkan proses yang sedang berjalan */
VIDEO.Ctl = function () { this.cancelled = false; this.hook = null; };
VIDEO.Ctl.prototype.cancel = function () {
  if (this.cancelled) return;
  this.cancelled = true;
  if (this.hook) { try { this.hook(); } catch (e) { /* abaikan */ } }
};

VIDEO.recorderMime = function () {
  if (typeof MediaRecorder !== 'function' || typeof MediaRecorder.isTypeSupported !== 'function') return '';
  const cands = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1.4D401E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return cands.find((m) => { try { return MediaRecorder.isTypeSupported(m); } catch (e) { return false; } }) || '';
};
VIDEO.canShrink = () => !!VIDEO.recorderMime() && typeof HTMLCanvasElement !== 'undefined' && typeof HTMLCanvasElement.prototype.captureStream === 'function';

/** MediaRecorder menulis berkas tanpa lama putar (Infinity): loncat ke ujung agar peramban menghitungnya */
VIDEO.fixDuration = function (v) {
  return new Promise((res) => {
    if (isFinite(v.duration)) return res(true);
    let done = false;
    const fin = () => {
      if (done) return; done = true; clearTimeout(to);
      v.removeEventListener('timeupdate', chk); v.removeEventListener('seeked', chk);
      try { v.currentTime = 0; } catch (e) { /* abaikan */ }
      res(isFinite(v.duration));
    };
    const chk = () => { if (isFinite(v.duration)) fin(); };
    const to = setTimeout(fin, 6000);
    v.addEventListener('timeupdate', chk); v.addEventListener('seeked', chk);
    try { v.currentTime = 1e101; } catch (e) { fin(); }
  });
};

/** buka berkas di elemen video tersembunyi -> { v, url, dur, w, h, close() } */
VIDEO.open = function (file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.setAttribute('playsinline', ''); v.playsInline = true; v.preload = 'auto';
    v.style.cssText = 'position:fixed;left:-10000px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    let settled = false, timer = null;
    const close = () => {
      v.onerror = null; v.onloadedmetadata = null;
      try { v.pause(); } catch (e) { /* abaikan */ }
      v.removeAttribute('src'); try { v.load(); } catch (e) { /* abaikan */ }
      v.remove(); URL.revokeObjectURL(url);
    };
    const fail = () => { if (settled) return; settled = true; clearTimeout(timer); close(); reject(vErr('bad_video')); };
    timer = setTimeout(fail, 25000);
    v.onerror = fail;
    v.onloadedmetadata = async () => {
      if (settled) return;
      const w = v.videoWidth, hh = v.videoHeight;
      if (!w || !hh) return fail();
      if (!isFinite(v.duration)) await VIDEO.fixDuration(v);
      if (settled) return;
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) return fail();
      settled = true; clearTimeout(timer); v.onerror = null; v.onloadedmetadata = null;
      resolve({ v, url, dur, w, h: hh, close });
    };
    v.src = url;
  });
};

VIDEO.seek = (v, t) => new Promise((res) => {
  if (Math.abs(v.currentTime - t) < 0.02 && v.readyState >= 2) return res();
  let done = false;
  const fin = () => { if (done) return; done = true; clearTimeout(to); v.removeEventListener('seeked', fin); res(); };
  const to = setTimeout(fin, 6000);
  v.addEventListener('seeked', fin);
  try { v.currentTime = t; } catch (e) { fin(); }
});

/** satu gambar dari video untuk sampul (JPEG) */
VIDEO.poster = async function (src) {
  const v = src.v, t = src.dur > 3 ? Math.min(1.5, src.dur * 0.2) : src.dur * 0.4;
  await VIDEO.seek(v, t);
  await Promise.race([nextFrame(), sleep(150)]);
  const sc = Math.min(1, 1280 / Math.max(src.w, src.h)), W = Math.max(2, Math.round(src.w * sc)), H = Math.max(2, Math.round(src.h * sc));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); x.drawImage(v, 0, 0, W, H);
  const blob = await canvasBlob(c, 'image/jpeg', 0.92);
  if (!blob) throw vErr('bad_video');
  return blob;
};

/** ukuran dan laju bit supaya hasilnya muat di batas; null bila terlalu panjang */
VIDEO.plan = function (dur, w, h, qk) {
  const q = VIDEO.QUALITY.find((x) => x.k === qk) || VIDEO.QUALITY[1], abps = 64000, fps = 30;
  const fit = Math.floor(VIDEO.MAX_BYTES * 8 * 0.84 / Math.max(1, dur)) - abps;
  if (fit < 200000) return null;
  const vbps = Math.min(q.vbps, fit);
  let side = Math.min(q.side, Math.max(w, h));
  const px = (s) => { const sc = Math.min(1, s / Math.max(w, h)); return Math.round(w * sc) * Math.round(h * sc); };
  while (side > 480 && vbps / (px(side) * fps) < 0.055) side = side > 1100 ? 1000 : side > 800 ? 640 : 480;
  return { side, vbps, abps, fps };
};

/** Putar video asli dan rekam ulang ke ukuran kecil (secepat waktu putarnya).
    Bagian awal sampai play() harus jalan sinkron di dalam ketukan pengguna, agar iOS mengizinkan suara. */

  o = o || {};

  return new Promise((resolve, reject) => {
    const mime = VIDEO.recorderMime();
    if (!mime) return reject(vErr('video_unsupported'));
    const sc = Math.min(1, plan.side / Math.max(src.w, src.h));
    const W = Math.max(2, Math.round(src.w * sc / 2) * 2), H = Math.max(2, Math.round(src.h * sc / 2) * 2);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { alpha: false }); cx.imageSmoothingQuality = 'high'; cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    let stream = null, rec = null, ac = null, hasAudio = false;
    try {
      stream = cv.captureStream(plan.fps || 30);
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          ac = new AC();
          const node = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination();
          node.connect(dest); /* tidak disambung ke speaker: suaranya hanya direkam, tidak terdengar */
          dest.stream.getAudioTracks().forEach((t) => { stream.addTrack(t); hasAudio = true; });
          if (ac.state !== 'running') ac.resume().catch(() => { /* abaikan */ });
        }
      } catch (e) { ac = null; hasAudio = false; }
      const mo = { mimeType: mime, videoBitsPerSecond: plan.vbps };
      if (hasAudio) mo.audioBitsPerSecond = plan.abps;
      rec = new MediaRecorder(stream, mo);
    } catch (e) { try { if (ac) ac.close(); } catch (x) { /* abaikan */ } return reject(vErr('video_unsupported')); }

    const chunks = []; let finished = false, ending = false, timer = null, lastT = -1, lastMove = performance.now();
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const cleanup = () => {
      finished = true; clearInterval(timer); document.removeEventListener('visibilitychange', onVis);
      v.onended = null; v.onerror = null; ctl.hook = null;
      try { v.pause(); } catch (e) { /* abaikan */ }
      try { stream.getTracks().forEach((t) => t.stop()); } catch (e) { /* abaikan */ }
      try { if (ac) ac.close(); } catch (e) { /* abaikan */ }
    };
    const abort = (err) => {
      if (finished) return;

      try { if (rec.state !== 'inactive') rec.stop(); } catch (e) { /* abaikan */ }
      reject(err);
    };

    rec.onstop = () => {
      if (finished) return;

      if (!blob.size) return reject(vErr('bad_video'));

    };
    const finish = () => {
      if (ending || finished) return; ending = true;
      try { cx.drawImage(v, 0, 0, W, H); } catch (e) { /* abaikan */ }
      try { rec.stop(); } catch (e) { abort(vErr('bad_video')); }
    };
    const draw = () => { if (finished || ending) return; try { cx.drawImage(v, 0, 0, W, H); } catch (e) { /* abaikan */ } sched(); };
    const sched = () => { if (finished || ending) return; if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(draw); else requestAnimationFrame(draw); };
    function onVis() {
      if (finished || ending) return;

/* Diorama parts: paper-cut shapes, peg dolls, name cards, photo frames.
   Everything is built from procedural geometry and PBR materials (felt, card, wood, painted wood).
   Conventions: Y is up, the stage front faces +Z, items stand with their origin at the base. */

const SHP = (() => {
  const S = (pts) => { const s = new THREE.Shape(); pts.forEach((p, i) => (i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]))); s.closePath(); return s; };
  const circle = (r, seg) => { const n = seg || 40, p = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; p.push([Math.cos(a) * r, Math.sin(a) * r]); } return S(p); };
  const ellipse = (rx, ry, seg) => { const n = seg || 40, p = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; p.push([Math.cos(a) * rx, Math.sin(a) * ry]); } return S(p); };
  /** Union-of-circles silhouette: flat bottom at y=0, bumpy top. Width w, nominal height h. */
  function cloud(w, h, seed) {
    const r = rng(seed || 7), k = Math.max(3, Math.round(w / (h * 0.8))), cs = [];
    for (let i = 0; i < k; i++) {
      const t = (i + 0.5) / k, mid = 1 - Math.abs(t - 0.5) * 1.5;
      const rad = (w / k) * (0.62 + 0.38 * mid) * (0.9 + r() * 0.25);
      cs.push({ x: -w / 2 + t * w + (r() - 0.5) * 0.04 * w, y: rad * 0.35, r: rad });
    }
    const x0 = Math.min(...cs.map((c) => c.x - c.r)), x1 = Math.max(...cs.map((c) => c.x + c.r)), pts = [], N = 90;
    for (let i = 0; i <= N; i++) {
      const x = x0 + ((x1 - x0) * i) / N; let y = 0;
      cs.forEach((c) => { const d = c.r * c.r - (x - c.x) * (x - c.x); if (d > 0) y = Math.max(y, c.y + Math.sqrt(d)); });
      pts.push([x, y]);
    }
    pts.push([x1, 0], [x0, 0]);
    const sc = h / Math.max(...pts.map((p) => p[1]));
    return S(pts.map((p) => [p[0] * Math.min(1.2, sc * 1.15), p[1] * sc]));
  }
  /** Rolling hill: width w, peak height h, flat base at y=0 */
  function hill(w, h, seed, rough) {
    const r = rng(seed || 3), p1 = r() * 6.28, p2 = r() * 6.28, a2 = 0.12 + (rough || 0.5) * 0.18, pts = [], N = 64;
    for (let i = 0; i <= N; i++) {
      const u = i / N, x = -w / 2 + u * w, edge = Math.sin(Math.PI * Math.min(1, Math.max(0, u))) ** 0.55;
      const y = h * (0.62 + 0.28 * Math.sin(u * 6.28 * 0.9 + p1) + a2 * Math.sin(u * 6.28 * 2.1 + p2)) * (0.35 + 0.65 * edge);

  function heart(s) { const p = [], N = 60; for (let i = 0; i < N; i++) { const t = (i / N) * Math.PI * 2; p.push([(16 * Math.sin(t) ** 3 * s) / 16, ((13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s) / 16]); } return S(p); }
  const flag = (w, h) => S([[-w / 2, 0], [w / 2, 0], [0, -h]]);

  function scallop(w, h, n) { const pts = [[-w / 2, h], [w / 2, h]]; const rr = w / n / 2; for (let i = n - 1; i >= 0; i--) { const cx = -w / 2 + rr * (2 * i + 1); for (let j = 0; j <= 10; j++) { const a = (j / 10) * Math.PI; pts.push([cx + Math.cos(a) * rr, -Math.sin(a) * rr * 0.9 + 0]); } } return S(pts); }
  /** Door / window with round top */
  function arch(w, h, seg) { const r = w / 2, p = [[-r, 0], [r, 0], [r, h - r]]; for (let i = 1; i < (seg || 14); i++) { const a = (i / (seg || 14)) * Math.PI; p.push([Math.cos(a) * r, h - r + Math.sin(a) * r]); } p.push([-r, h - r]); return S(p); }

  function wave(w, h, n, amp) { const p = [[-w / 2, 0], [w / 2, 0]]; const N = 48; for (let i = N; i >= 0; i--) { const u = i / N; p.push([-w / 2 + u * w, h + Math.sin(u * n * Math.PI * 2) * amp]); } return S(p); }

  function zig(w, h, n, amp) { const p = [[-w / 2, 0], [w / 2, 0]]; for (let i = n; i >= 0; i--) { const u = i / n; p.push([-w / 2 + u * w, h + (i % 2 ? amp : 0)]); } return S(p); }
  const rect = (w, h) => S([[-w / 2, 0], [w / 2, 0], [w / 2, h], [-w / 2, h]]);
  const rrect = (w, h, r) => GEO.rrShape(w, h, r);
  const tri = (w, h) => S([[-w / 2, 0], [w / 2, 0], [0, h]]);
  const crescent = (r) => { const p = [], N = 40; for (let i = 0; i <= N; i++) { const a = -Math.PI * 0.62 + (i / N) * Math.PI * 1.24; p.push([Math.cos(a) * r, Math.sin(a) * r]); } for (let i = N; i >= 0; i--) { const a = -Math.PI * 0.62 + (i / N) * Math.PI * 1.24; p.push([Math.cos(a) * r * 0.62 + r * 0.34, Math.sin(a) * r * 0.78]); } return S(p); };
  return { S, circle, ellipse, cloud, hill, star, heart, flag, scallop, arch, wave, zig, rect, rrect, tri, crescent };
})();

Dio.cut = function (shape, depth, mat, o) {

};
/** Vertical panel in the YZ plane (for side walls): shape x -> world Z, shape y -> world Y; thickness along X (centred). */
Dio.cutYZ = function (shape, depth, mat) {

Dio.mesh = function (geo, mat, x, y, z) { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; if (x != null) m.position.set(x, y || 0, z || 0); return m; };

/* ---------- text on cards ---------- */
Dio._textCache = new Map();
Dio.textTexture = function (text, o) {
  o = o || {}; const W = o.w || 512, H = o.h || 160, key = [text, W, H, o.font, o.color, o.bg, o.align, o.weight, o.fit, o.size].join('|');
  if (Dio._textCache.has(key)) return Dio._textCache.get(key);
  const c = TX.cv(W, H), x = c.getContext('2d');

/* ---------- photos as textures ---------- */
const Photos3D = {
  _t: new Map(), _lru: [],
  _keep(key, tex) { this._t.set(key, tex); this._lru.push(key); while (this._lru.length > 36) { const k = this._lru.shift(); const t = this._t.get(k); if (t && t.then === undefined) { /* promise placeholders are cheap */ } this._t.delete(k); if (t && t.dispose) { /* texture may still be in use by a frame: let GC handle it */ } } },
  /** lingkaran dengan segitiga putar di tengah gambar sampul video */
  _playBadge(x, w, h) {
    const r = Math.min(w, h) * 0.17, cx = w / 2, cy = h / 2, t = r * 0.46;
    x.save();
    x.fillStyle = 'rgba(16,22,44,.58)'; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
    x.lineWidth = Math.max(2, r * 0.09); x.strokeStyle = 'rgba(255,255,255,.92)'; x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.moveTo(cx - t * 0.55, cy - t); x.lineTo(cx + t * 0.95, cy); x.lineTo(cx - t * 0.55, cy + t); x.closePath(); x.fill();
    x.restore();
  },
  _toTex(img, max, vid) {
    const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
    const c = TX.cv(Math.max(2, Math.round(w * sc)), Math.max(2, Math.round(h * sc))); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
    if (vid) this._playBadge(x, c.width, c.height);
    const t = TX.tex(c); t.userData = { owned: true }; t.minFilter = THREE.LinearMipmapLinearFilter; return t;
  },
  thumb(ph) {
    const key = 't:' + ph.id; if (this._t.has(key)) return this._t.get(key);
    const url = S.thumbURL(ph); if (!url) return Promise.resolve(null);
    const p = loadImg(url).then((img) => this._toTex(img, 256, S.isVideo(ph)));
    this._keep(key, p); return p;
  },
  full(ph) {
    const key = 'f:' + ph.id; if (this._t.has(key)) return this._t.get(key);
    const p = S.photoBlob(ph).then((b) => decodeFile(b)).then((img) => { const t = this._toTex(img, 768, S.isVideo(ph)); if (img.close) try { img.close(); } catch (e) { /* ignore */ } return t; });
    p.catch(() => this._t.delete(key));
    this._keep(key, p); return p;
  },
  clear() { this._t.clear(); this._lru = []; },
};

/* Diorama kit: small builders shared by the category scenes. Same look as the reference scene (perayaan):

(function () {

  K.tube = (pts, r, mat, seg) => { const g = new T.TubeGeometry(new T.CatmullRomCurve3(pts.map((p) => new T.Vector3(p[0], p[1], p[2]))), seg || 24, r, 8, false); const m = new T.Mesh(g, mat); m.castShadow = false; return m; };
  K.fitUV = (mesh, w, h, x0, y0) => { const uv = mesh.geometry.attributes.uv, p = mesh.geometry.attributes.position; for (let i = 0; i < uv.count; i++) uv.setXY(i, (p.getX(i) - x0) / w, (p.getY(i) - y0) / h); };

    for (let i = 0; i < 6; i++) { const a = (i / 6) * 6.283, pt = K.ball(0.018, MAT.paint('#F5A6C0'), 1, 0.45, 1.5); pt.position.set(0.1 + Math.cos(a) * 0.022, 0.036, 0.14 + Math.sin(a) * 0.022); pt.rotation.y = Q - a; g.add(pt); }

  Dio.register('alam', {

      if (night) {

        for (let i = 0; i < 10; i++) { const ray = Dio.cut(SHP.tri(0.05, 0.08), 0.014, MAT.basic(col)); ray.position.set(Math.cos((i / 10) * 6.283) * 0.22, Math.sin((i / 10) * 6.283) * 0.22, 0); ray.rotation.z = (i / 10) * 6.283 - Q; sun.add(ray); }

      }

      });

      const rip = pd.userData.rip, dk = pd.userData.duck, wings = [bf.userData.wings, bf2.userData.wings];

        fl.forEach((f, i) => { f.rotation.z = Math.sin(t * 1.5 + i) * 0.1; });
        clouds.forEach((c, i) => { c.m.position.x = c.x + Math.sin(t * 0.12 + i * 2) * 0.08; });
        rip.forEach((r, i) => { const k = (t * 0.35 + i * 0.5) % 1; r.scale.setScalar(0.3 + k * 1.9); r.material.opacity = 0.5 * (1 - k); });
        const a = t * 0.35; dk.position.set(Math.cos(a) * 0.2, 0.02, Math.sin(a) * 0.2); dk.rotation.y = Math.atan2(Math.sin(a), -Math.cos(a)) + 0.0;
        [[bf, 0, 0], [bf2, 2.4, 1]].forEach((b, i) => {

          b[0].position.set(x, 0.42 + Math.sin(u * 1.3) * 0.07 + i * 0.1, z); b[0].rotation.y = Math.atan2(-vx, -vz);

  function ringTube(cx, cz, rx, rz, r, mat) {

  }
  function trainCar(kind, pal, col) {

      const boiler = K.cyl(0.042, 0.042, 0.15, MAT.paint(pal.accent2, { roughness: 0.4 }), 18); boiler.rotation.x = Q; boiler.position.set(0, 0.105, -0.045); g.add(boiler);
      const chim = K.cyl(0.015, 0.02, 0.05, dark, 12); chim.position.set(0, 0.168, -0.1); g.add(chim);
      const cab = K.box(0.1, 0.07, 0.07, wood, 0.01); cab.position.set(0, 0.07, 0.07); g.add(cab);
      const roof = K.box(0.115, 0.012, 0.085, dark, 0.004); roof.position.set(0, 0.14, 0.07); g.add(roof);
    } else {
      const body = K.box(0.1, 0.05, 0.18, wood, 0.01); body.position.y = 0.035; g.add(body);
      [['#F4C95D', -0.03], ['#86C79A', 0.04]].forEach((b) => { const c = K.box(0.07, 0.05, 0.05, MAT.paint(b[0]), 0.008); c.position.set(0, 0.085, b[1]); g.add(c); });

  Dio.register('bermain', {
    floor: 'check', walls: { back: 'paper', sides: 'low' },
    build(ctx) {
      const { pal } = ctx;

      /* wall: big paper shapes */
      const sh = [[Dio.cut(SHP.circle(0.2, 40), 0.025, MAT.paper('#D9604E')), -0.55], [Dio.cut(SHP.rect(0.35, 0.35), 0.025, MAT.paper('#4A88C2')), 0.0], [Dio.cut(SHP.tri(0.43, 0.38), 0.025, MAT.paper('#E9B93C')), 0.55]];
      sh.forEach((s, i) => { s[0].position.set(s[1], i === 0 ? 1.12 : 0.97, 0.05); s[0].rotation.z = (i - 1) * 0.12; ctx.onBack(s[0], { poke: true }); });
      const dots = [0, 1, 2].map((i) => { const d = Dio.cut(SHP.circle(0.035, 20), 0.03, MAT.paper('#FFF6E0')); d.position.set(-0.55 + i * 0.55, 1.12 - (i ? 0.15 : 0), 0.072); ctx.onBack(d); return d; });

      /* wooden train circling a track */
      const trackMat = MAT.woodSmall('#d2a86f', 1), cx = 0.0, cz = -0.38, rx = 0.82, rz = 0.4;
      const track = Dio.group('track'); track.add(ringTube(cx, cz, rx + 0.04, rz + 0.04, 0.009, trackMat), ringTube(cx, cz, rx - 0.04, rz - 0.04, 0.009, trackMat));
      for (let i = 0; i < 40; i++) { const a = (i / 40) * Math.PI * 2, s = K.box(0.13, 0.016, 0.031, trackMat, 0.005); s.position.set(cx + Math.cos(a) * rx, 0, cz + Math.sin(a) * rz); s.rotation.y = Math.atan2(-Math.sin(a) * rx, Math.cos(a) * rz); track.add(s); }
      ctx.add(track, { mode: 'rise', delay: 0.3 });
      const cars = [trainCar('loco', pal, pal.accent), trainCar('wagon', pal, '#6FA8C9'), trainCar('wagon', pal, '#F4A95D')]; cars.forEach((c, i) => { c.scale.setScalar(1.6); ctx.add(c, { mode: 'none' }); });
      let u = 1.2;
      ctx.tick((dt) => {
        u += dt * (0.42 + (cars[0].userData.boost || 0)); cars[0].userData.boost = (cars[0].userData.boost || 0) * Math.pow(0.35, dt);
        cars.forEach((c, i) => { const a = u - i * 0.56, tx = -Math.sin(a) * rx, tz = Math.cos(a) * rz; c.position.set(cx + Math.cos(a) * rx, 0.012, cz + Math.sin(a) * rz); c.rotation.y = Math.atan2(-tx, -tz); });
        return true;
      });

    const ts = K.cyl(0.0, 0.03, 0.1, gold, 12); ts.position.set(side * -0.1, 0.5, 0.1); ts.rotation.z = Math.PI; g.add(ts);

  function stanchion() { const g = Dio.group('stanchion'), gold = MAT.metal('#E0B13A'); g.add(K.cyl(0.07, 0.08, 0.02, gold, 24), K.cyl(0.012, 0.012, 0.36, gold, 10)); const bl = K.ball(0.03, gold); bl.position.y = 0.38; g.add(bl); return g; }

      ctx.add(beam, { mode: 'none' }); ctx.add(glow, { mode: 'none' }); [beam, glow].forEach((m) => { m.castShadow = false; m.receiveShadow = false; });

/* ===== 48-cover-stk-hewan.js ===== */
/* Stiker hewan lucu dan mainan bayi, digambar dengan kode Canvas 2D pada kotak satuan (x, y dari -0.5 sampai 0.5).
   Gaya "kawaii": bentuk gemuk, kontur tinta tebal seragam, warna isi rata, satu kilau lembut, wajah titik + senyum + pipi.
   Pada palet foil semua warna isi (a, b, c, w) sama, jadi setiap bagian dalam dipisahkan dengan garis tinta tipis.
   Jangan ubah kunci stiker; kunci tersimpan di data keluarga. */
(() => {
  const PI = Math.PI, TAU = PI * 2;

  /* ---------- pembantu gambar ---------- */
  /* jalur lonjong (rot dalam radian) */
  const ov = (c, x, y, rx, ry, rot) => { c.beginPath(); c.ellipse(x, y, rx, ry == null ? rx : ry, rot || 0, 0, TAU); };
  /* isi jalur yang sedang dibuat lalu beri kontur tinta (m = pengali tebal garis) */
  const edge = (c, g, fill, m) => { if (fill) { c.fillStyle = fill; c.fill(); } c.lineWidth = g.lw * (m || 1.3); c.strokeStyle = g.ink; c.stroke(); };
  const blob = (c, g, fill, x, y, rx, ry, rot, m) => { ov(c, x, y, rx, ry, rot); edge(c, g, fill, m); };
  /* kurva mulus melalui titik [x0, y0, x1, y1, ...] (Catmull-Rom); closed = tertutup, k = kekencangan */
  const curve = (c, p, closed, k) => {
    const n = p.length >> 1, t = (k == null ? 1 : k) / 6;
    const P = (i) => { i = closed ? ((i % n) + n) % n : Math.max(0, Math.min(n - 1, i)); return [p[2 * i], p[2 * i + 1]]; };
    c.beginPath(); c.moveTo(p[0], p[1]);
    const m = closed ? n : n - 1;
    for (let i = 0; i < m; i++) {
      const a = P(i - 1), b = P(i), d = P(i + 1), e = P(i + 2);
      c.bezierCurveTo(b[0] + (d[0] - a[0]) * t, b[1] + (d[1] - a[1]) * t, d[0] - (e[0] - b[0]) * t, d[1] - (e[1] - b[1]) * t, d[0], d[1]);
    }
    if (closed) c.closePath();
  };
  const shape = (c, g, fill, pts, k, m) => { curve(c, pts, true, k); edge(c, g, fill, m); };
  const poly = (c, g, fill, pts, m) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); edge(c, g, fill, m); };
  /* garis detail tinta */
  const line = (c, g, pts, m) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.lineWidth = g.lw * (m || 0.8); c.strokeStyle = g.ink; c.stroke(); };
  /* pipa tebal berkontur (ekor, belalai, lengan); build(c) membuat jalur terbuka, w = lebar luar */
  const tube = (c, g, fill, build, w, m) => {
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    build(c); c.lineWidth = w; c.strokeStyle = g.ink; c.stroke();
    build(c); c.lineWidth = Math.max(0.01, w - g.lw * 2 * (m || 1.3)); c.strokeStyle = fill; c.stroke();
    c.restore();
  };
  const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };

  const eyes = (c, g, x, y, dx, r) => { dot(c, g.ink, x - dx, y, r); dot(c, g.ink, x + dx, y, r); };

  /* mulut "w": dua busur kecil yang bertemu di (x, y) */

/* ===== 49-cover-stk-alam.js ===== */
/* Stiker langit dan alam (alam), pesta dan hati (pesta), dan hiasan (hias).
   Gaya kawaii datar: kontur g.ink tebal seragam, isi rata, satu sorotan lembut. Hanya memakai slot a/b/c/w dan ink
   supaya semua palet (termasuk foil dan satu warna) tetap terbaca; bagian dalam selalu dipisahkan dengan garis ink.
   Tidak ada Math.random: semua variasi memakai rumus tetap. */
(() => {
  const PI = Math.PI, TAU = PI * 2, hypot = Math.hypot, sin = Math.sin, cos = Math.cos, atan2 = Math.atan2, sqrt = Math.sqrt;

  /* ---------- pembantu umum ---------- */
  /* garis tepi tebal seragam pada jalur aktif */
  const edge = (c, g, k) => { c.lineWidth = g.lw * (k || 1.3); c.strokeStyle = g.ink; c.stroke(); };
  /* isi lalu beri garis tepi */
  const paint = (c, g, col, k) => { c.fillStyle = col; c.fill(); edge(c, g, k); };
  const rrect = (c, x, y, w, h, r) => { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); };
  const line2 = (c, g, x0, y0, x1, y1) => { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); edge(c, g, 0.7); };
  const disc = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, TAU); };
  const ell = (c, x, y, rx, ry, rot) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); };
  /* bayangan gelap dan sorotan terang lembut di atas jalur aktif */
  const shade = (c, g, a) => { c.save(); c.globalAlpha = a == null ? 0.14 : a; c.fillStyle = g.ink; c.fill(); c.restore(); };
  const glow = (c, g, a) => { c.save(); c.globalAlpha = a == null ? 0.5 : a; c.fillStyle = g.w; c.fill(); c.restore(); };
  /* goresan sorotan: garis lengkung tipis putih; fn membangun jalur (tanpa beginPath) */
  const gleam = (c, g, w, a, fn) => { c.save(); c.globalAlpha = a == null ? 0.6 : a; c.strokeStyle = g.w; c.lineWidth = w || 0.03; c.lineCap = 'round'; c.beginPath(); fn(); c.stroke(); c.restore(); };
  /* batang tebal bergaris tepi; paths = fungsi (atau daftar fungsi) pembangun jalur tanpa beginPath */
  const tube = (c, g, w, col, paths) => {
    const list = Array.isArray(paths) ? paths : [paths];
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = g.ink; c.lineWidth = w + g.lw * 2.6; list.forEach((p) => { c.beginPath(); p(); c.stroke(); });
    c.strokeStyle = col; c.lineWidth = w; list.forEach((p) => { c.beginPath(); p(); c.stroke(); });
    c.restore();
  };

  /* ---------- wajah ---------- */
  const cheeks = (c, g, x, y, s, dx) => {
    c.save(); c.fillStyle = g.c; c.globalAlpha = 0.55; c.beginPath();
    c.arc(x - dx * s, y, 0.026 * s, 0, TAU); c.moveTo(x + dx * s + 0.026 * s, y); c.arc(x + dx * s, y, 0.026 * s, 0, TAU); c.fill(); c.restore();
  };
  const face = (c, g, x, y, s) => {
    c.save(); c.fillStyle = g.ink; c.beginPath();
    c.arc(x - 0.07 * s, y, 0.02 * s, 0, TAU); c.moveTo(x + 0.07 * s + 0.02 * s, y); c.arc(x + 0.07 * s, y, 0.02 * s, 0, TAU); c.fill();
    c.strokeStyle = g.ink; c.lineWidth = 0.016 * s + 0.004; c.lineCap = 'round'; c.beginPath(); c.arc(x, y + 0.02 * s, 0.04 * s, 0.15 * PI, 0.85 * PI); c.stroke(); c.restore();
    cheeks(c, g, x, y + 0.04 * s, s, 0.12);
  };
  /* wajah tidur: mata terpejam melengkung ke bawah */
  const sleepFace = (c, g, x, y, s) => {
    c.save(); c.strokeStyle = g.ink; c.lineCap = 'round'; c.lineWidth = 0.016 * s + 0.004;
    c.beginPath(); c.arc(x - 0.075 * s, y, 0.03 * s, 0.1 * PI, 0.9 * PI); c.stroke();
    c.beginPath(); c.arc(x + 0.075 * s, y, 0.03 * s, 0.1 * PI, 0.9 * PI); c.stroke();
    c.beginPath(); c.arc(x, y + 0.04 * s, 0.026 * s, 0.1 * PI, 0.9 * PI); c.stroke(); c.restore();
    cheeks(c, g, x, y + 0.05 * s, s, 0.125);
  };
  /* wajah gembira: mata ^ ^ */
  const joyFace = (c, g, x, y, s) => {
    c.save(); c.strokeStyle = g.ink; c.lineCap = 'round'; c.lineWidth = 0.016 * s + 0.004;
    c.beginPath(); c.arc(x - 0.075 * s, y + 0.02 * s, 0.03 * s, 1.1 * PI, 1.9 * PI); c.stroke();
    c.beginPath(); c.arc(x + 0.075 * s, y + 0.02 * s, 0.03 * s, 1.1 * PI, 1.9 * PI); c.stroke();
    c.beginPath(); c.arc(x, y + 0.03 * s, 0.04 * s, 0.15 * PI, 0.85 * PI); c.stroke(); c.restore();
    cheeks(c, g, x, y + 0.05 * s, s, 0.125);
  };

  /* ---------- bentuk ---------- */
  /* poligon bersudut membulat */
  const rpoly = (c, pts, r) => {

/* ===== 50-book-geo.js ===== */
/* Book geometry: boards, spine, page blocks, leaves with a paper curl. World units: one page is 3.2 wide, 4.5 tall.
   The spine runs along Z at x = 0. Right pages lie at x > 0, left pages at x < 0. The table surface is at y = BK.Y0. */

const BK = {
  PW: 3.2, PH: 4.5, CT: 0.09, OV: 0.13, SEG: 28, Y0: 0.046, LIFT: 0.0016,
  /** total thickness of a page block with n leaves (grows fast, then saturates) */
  blockH(n) { return n <= 0 ? 0 : 0.06 + 0.66 * (1 - Math.exp(-n / 18)); },
};

/** Rounded slab (x: w, y: t, z: d, centred). Top face gets 0..1 UVs so one texture can cover it; sides sample the top-left texel. */
BK.slab = function (w, d, t, r) {
  const g = GEO.rbox(w, t, d, r, 2);
  const nrm = g.attributes.normal, pos = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    if (nrm.getY(i) > 0.98) uv.setXY(i, (pos.getX(i) + w / 2) / w, 1 - (pos.getZ(i) + d / 2) / d);
    else uv.setXY(i, 0.012, 0.988);
  }
  return g;
};

/** Leaf: a strip of SEG+1 columns x 2 rows. u = s/PW along the page, v = 1 at the top edge (z = -PH/2). */
BK.leafGeometry = function () {
  const nx = BK.SEG + 1, pos = new Float32Array(nx * 2 * 3), uv = new Float32Array(nx * 2 * 2), idx = [];
  for (let i = 0; i < nx; i++) for (let k = 0; k < 2; k++) {
    const o = i * 2 + k; pos[o * 3] = (BK.PW * i) / BK.SEG; pos[o * 3 + 1] = 0; pos[o * 3 + 2] = k ? BK.PH / 2 : -BK.PH / 2;
    uv[o * 2] = i / BK.SEG; uv[o * 2 + 1] = k ? 0 : 1;
  }
  for (let i = 0; i < BK.SEG; i++) { const a = i * 2, b = (i + 1) * 2, c = a + 1, d = b + 1; idx.push(a, c, b, b, c, d); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nx * 2 * 3), 3)); g.setIndex(idx);
  BK.poseLeaf(g, 0, 0, 0, 1);
  return g;
};

/** Bend a leaf: root at (0, rootY), base angle phi (0 = lying right, PI = lying left); bend adds k*(s/PW)^alpha to the local angle. */
BK.poseLeaf = function (g, rootY, phi, k, alpha) {
  const p = g.attributes.position, ds = BK.PW / BK.SEG; let x = 0, y = rootY;
  for (let i = 0; i <= BK.SEG; i++) {
    for (let r = 0; r < 2; r++) { const o = i * 2 + r; p.setX(o, x); p.setY(o, y); }
    if (i < BK.SEG) { const a = phi + k * Math.pow((i + 0.5) / BK.SEG, alpha); x += ds * Math.cos(a); y += ds * Math.sin(a); }
  }
  p.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere(); g.computeBoundingBox();
};

/** Fine horizontal lines for the page-block edge */
BK.edgeTexture = function () {
  const c = TX.cv(8, 128), x = c.getContext('2d'), r = rng(9);
  x.fillStyle = '#F1E9D8'; x.fillRect(0, 0, 8, 128);
  for (let y = 0; y < 128; y += 2) { x.fillStyle = 'rgba(110,92,64,' + (0.1 + r() * 0.16) + ')'; x.fillRect(0, y, 8, 1); }
  const t = TX.tex(c, { repeat: [1, 1] }); t.userData = { shared: true }; return t;
};

/** Set cloth colours / cover art for the current child */

  const mk = (cv, srgb) => { const t = TX.tex(cv, { aniso: GFX.maxAniso, srgb }); t.userData = { owned: true }; return t; };

    return new THREE.MeshStandardMaterial({ map: P[pre + 'Tex'], bumpMap: P[pre + 'Bump'], bumpScale: Book.coverBump, roughnessMap: P[pre + 'Orm'], metalnessMap: P[pre + 'Orm'], roughness: 1, metalness: 1, envMapIntensity: 0.5 });
  };

Book.coverBump = 0.1;


/* ===== 51-book.js ===== */
/* Book behaviour: layout, page flips, cover, textures, diorama lifecycle, picking, camera framing.
   Spreads: -1 closed | 0 title page | 1..M one memory each (text left, diorama right) | M+1 end page.
   Leaf i: front = right face of spread i, back = left face of spread i+1. There are M+1 leaves. */

Object.assign(Book, {
  STAGE_Z: -0.78,
  wanted: null, running: false, flipping: null, idleAcc: 0, curMemId: null, quality: 'high', texSize: { high: [1024, 1440], medium: [768, 1080], low: [512, 720] },

/* ---------- model ---------- */
Book.setModel = function (model, o) {
  if (!Book.ready) return;
  const keep = !o || o.keep !== false;
  const prevId = keep ? Book.curMemId : null, prevSpread = keep ? Book.spread : -1;
  Book.model = model; Book.child = model.child || null; Book.mems = model.mems || []; Book.M = Book.mems.length; Book.N = Book.M + 1;
  Book.Htot = BK.blockH(Book.N); Book.delta = Book.Htot / Book.N;
  Book.clearTextures();
  model.theme = CoverArt.theme(model);
  const cm = Book.coverModel(), theme = cm === model ? model.theme : CoverArt.theme(cm);
  const csz = Book.texSize[Book.quality], ck = Pages.coverKey(cm, csz);
  if (ck !== Book.coverKey) { const covers = Pages.cover(cm, csz); Book.applyTheme(theme, covers.front, covers.back); Book.coverKey = ck; }
  if (cm.child && cm.child.cv) CoverArt.warm(cm.child.cv, () => Book.refreshCover());
  Book.setEndpapers();
  let s = prevSpread;
  if (prevId) { const i = Book.mems.findIndex((m) => m.id === prevId); if (i >= 0) s = i + 1; }
  s = clamp(s, -1, Book.M + 1);
  Book.spread = s; Book.wanted = null;
  Book.hideDio(false);
  Book.layout(); Book.frame(true); Book.afterSettle(true);
  Book.emit('model');
};

/** Model untuk penggambaran sampul: sama dengan model buku, kecuali saat pratinjau rancangan dari studio sampul. */
Book.coverModel = function () {
  const m = Book.model, pc = Book.previewChild;
  return pc ? Object.assign({}, m, { child: pc, cover: pc.cover || m.cover }) : m;
};
/** gambar ulang sampul saja (mis. setelah foto atau font sampul selesai dimuat) */
Book.refreshCover = function (force) {
  if (!Book.model || !Book.ready || Studio.active) return;
  const model = Book.coverModel(), theme = CoverArt.theme(model);
  if (model === Book.model) model.theme = theme;
  const csz = Book.texSize[Book.quality], ck = Pages.coverKey(model, csz);
  if (ck === Book.coverKey && !force) return;
  const covers = Pages.cover(model, csz); Book.applyTheme(theme, covers.front, covers.back); Book.coverKey = ck;
  GFX.invalidate();
};
/** Pratinjau rancangan sampul (anak dengan cv baru) pada buku 3D tertutup, tanpa menyimpan apa pun. */
Book.previewCover = function (child) {
  if (!Book.ready || !Book.model) return false;
  if (Book._prevSpread == null) Book._prevSpread = Book.spread;
  Book.previewChild = child;
  if (Book.spread !== -1) Book.setModel(Book.model, { keep: false }); /* menutup buku seketika, tanpa membalik halaman satu per satu */
  else Book.refreshCover(true);
  if (child.cv) CoverArt.warm(child.cv, () => Book.refreshCover());
  return true;
};
Book.endPreview = function () {
  if (!Book.previewChild && Book._prevSpread == null) return;
  Book.previewChild = null; Book.peekYaw = 0;
  const back = Book._prevSpread; Book._prevSpread = null;
  Book.refreshCover(true);
  if (back != null && back >= 0 && Book.model) Book.goto(Math.min(back, Book.M + 1));
  else Book.frame(false);
};

Book.setEndpapers = function () {
  const P = Book.parts, sz = Book.texSize[Book.quality], mk = (cv) => { const t = TX.tex(cv, { aniso: GFX.maxAniso }); t.userData = { owned: true }; return t; };
  const f = Pages.render({ kind: 'endpaper', side: 'front' }, Book.model, sz), b = Pages.render({ kind: 'endpaper', side: 'back' }, Book.model, sz);
  if (P.epFrontTex) P.epFrontTex.dispose(); if (P.epBackTex) P.epBackTex.dispose();
  P.epFrontTex = mk(f.canvas); P.epBackTex = mk(b.canvas);
  P.epFrontMat.map = P.epFrontTex; P.epBackMat.map = P.epBackTex; P.epFrontMat.needsUpdate = P.epBackMat.needsUpdate = true;
};

Book.setQuality = function (q) {
  if (!Book.texSize[q] || q === Book.quality) return;
  Book.quality = q;
  if (Book.model) Book.setModel(Book.model);
};

/* ---------- face textures ---------- */
Book.faceDesc = function (side, j) {
  const M = Book.M, mems = Book.mems;
  if (side === 'R') { if (j === 0) return { kind: 'title' }; if (j >= 1 && j <= M) return { kind: 'plate', mem: mems[j - 1], no: j }; return null; }
  if (j >= 1 && j <= M) return { kind: 'text', mem: mems[j - 1], no: j };
  if (j === M + 1) return { kind: 'end' };
  return null;
};
Book.faceKey = function (d) { return d ? [d.kind, d.mem ? d.mem.id + ':' + d.mem.rev + ':' + d.mem.t : '', d.no || '', Book.quality, Book.theme ? Book.theme.key : '', Book.model ? Book.model.sig : ''].join('|') : ''; };
Book.faceTex = function (desc, flip) {
  if (!desc) return null;
  const key = Book.faceKey(desc) + (flip ? '|b' : '|f');
  let e = Book.tex.get(key);
  if (!e) {
    const r = Pages.render(desc, Book.model, Book.texSize[Book.quality]);
    const t = TX.tex(r.canvas, { aniso: GFX.maxAniso }); t.userData = { owned: true };
    if (flip) { t.wrapS = THREE.RepeatWrapping; t.repeat.x = -1; t.offset.x = 1; t.needsUpdate = true; }
    e = { tex: t, hots: r.hots, w: r.canvas.width, h: r.canvas.height, desc, flip: !!flip };
    Book.tex.set(key, e);

Book._evict = function () {

  while (Book.texLRU.length > 14) {

    if (!k) break; Book.texLRU = Book.texLRU.filter((x) => x !== k); const e = Book.tex.get(k); Book.tex.delete(k); if (e && e.tex) e.tex.dispose();

Book.clearTextures = function () {

  Book.tex.forEach((e) => e.tex && e.tex.dispose()); Book.tex.clear(); Book.texLRU = [];
};

/* ---------- leaves ---------- */
Book.freeLeaf = function () { return Book.pool.find((L) => L.leaf < 0) || null; };
Book.leafAt = function (i) { return Book.pool.find((L) => L.leaf === i) || null; };
Book.assignLeaf = function (L, i) {
  L.leaf = i;
  if (i < 0) { L.front.visible = L.back.visible = false; L.fe = L.be = null; L.fm.map = L.bm.map = null; return; }
  const fe = Book.faceTex(Book.faceDesc('R', i), false), be = Book.faceTex(Book.faceDesc('L', i + 1), true);
  L.fe = fe; L.be = be; L.fm.map = fe ? fe.tex : null; L.bm.map = be ? be.tex : null; L.fm.needsUpdate = L.bm.needsUpdate = true;
  L.front.visible = L.back.visible = true;
};
Book.poseStatic = function (L, side, h) {
  const y = BK.Y0 + BK.CT + h + BK.LIFT;
  BK.poseLeaf(L.geo, y, side === 'R' ? 0 : Math.PI, 0, 1); L.side = side; L.front.castShadow = false; L.back.castShadow = false;
};

/** Place everything for the resting state at Book.spread */
Book.layout = function () {
  const P = Book.parts, j = Book.spread, N = Book.N, M = Book.M, d = Book.delta;
  const nR = j < 0 ? N : clamp(N - j, 0, N), nL = j < 0 ? 0 : clamp(j, 0, N);
  Book.nR = nR; Book.nL = nL;
  // blocks
  const setBlock = (b, side, n) => {
    const h = d * n; b.visible = n > 0; if (!n) return;
    b.scale.set(BK.PW - 0.03, h, BK.PH - 0.03); b.position.set((side === 'R' ? 1 : -1) * (BK.PW / 2), BK.Y0 + BK.CT + h / 2 - 0.001, 0);
    const em = b.userData.edgeMat; em.map.repeat.set(1, Math.max(0.2, h * 52 / 128 * 3)); em.map.needsUpdate = true;
  };
  setBlock(P.blockR, 'R', nR); setBlock(P.blockL, 'L', nL);
  // leaves: top right + top left
  Book.pool.forEach((L) => Book.assignLeaf(L, -1));
  if (nR > 0) { const L = Book.pool[0]; Book.assignLeaf(L, Math.max(j, 0)); Book.poseStatic(L, 'R', d * nR); }
  if (nL > 0) { const L = Book.pool[1]; Book.assignLeaf(L, j - 1); Book.poseStatic(L, 'L', d * nL); }

  Book.setCoverAngle(j < 0 ? 0 : Math.PI);

Book.setCoverAngle = function (a) {
  const P = Book.parts, Ht = Book.Htot;
  Book.coverAngle = a;
  const yp = BK.Y0 + BK.CT + Ht / 2 + 0.003;
  P.cover.position.set(0, yp, 0); P.cover.rotation.z = a;
  P.front.position.y = Ht / 2 + BK.CT / 2;
  P.epFront.position.set((BK.PW + BK.OV - 0.075) / 2, Ht / 2 - 0.0013, 0);
  const closed = 1 - clamp(a / 0.5, 0, 1);
  const h = lerp(BK.CT * 0.9, 2 * BK.CT + Ht + 0.01, closed);
  P.spine.scale.y = h; P.spine.position.set(lerp(0.0, -0.062, closed), BK.Y0 + h / 2, 0);
  P.epBack.visible = true;

};

/* ---------- camera ---------- */
/** Frame the open book. Screen-vertical extent of the page area is v = y*cos(pitch) - z*sin(pitch); with a diorama
    standing on the right page the walls rise above the back edge, so the target moves back (-z) and `hh` grows. */
Book.frame = function (instant) {
  if (typeof Studio !== 'undefined' && Studio.active) return Studio.frame(instant);
  const j = Book.spread, W = BK.PW + BK.OV, H = BK.PH + 2 * BK.OV, c = Book.compact = GFX.size.w / GFX.size.h < 1.12;
  const dio = j >= 1 && j <= Book.M, z = dio ? -0.6 : 0, hh = dio ? 1.95 : 0.4;
  let spec;
  if (j < 0) spec = { x: W / 2 - 0.02, y: 0.15, z: -0.1, w: W + 0.7, d: H, hh: 0.35 };
  else if (c) {
    const f = j > Book.M ? 'L' : Book.focus === 'L' ? 'L' : Book.focus === 'C' ? 'C' : 'R';
    spec = { x: f === 'C' ? 0 : (f === 'L' ? -1 : 1) * (BK.PW / 2 + 0.02), y: 0.14, z, w: f === 'C' ? W * 1.25 : W + 0.5, d: H, hh };
  } else spec = { x: 0, y: 0.14, z, w: 2 * W + 1.0, d: H * (dio ? 1.15 : 1), hh };

/* ---------- navigation ---------- */
Book.canNext = () => Book.spread <= Book.M;
Book.canPrev = () => Book.spread >= 0;
Book.next = function () { return Book.goto(Math.min(Book.M + 1, (Book.wanted != null ? Book.wanted : Book.spread) + 1)); };
Book.prev = function () { return Book.goto(Math.max(-1, (Book.wanted != null ? Book.wanted : Book.spread) - 1)); };
Book.goto = function (t) {

};
Book.once = function (ev, fn) { const off = Book.on(ev, (...a) => { off(); fn(...a); }); };

Book.run = async function () {
  Book.running = true;

    while (Book.wanted != null && Book.wanted !== Book.spread) {
      const j = Book.spread, t = Book.wanted, dir = t > j ? 1 : -1;
      if (Math.abs(t - j) > 3 && j >= 0 && t >= 0) await Book.jump(t);
      else if (j === -1 && dir > 0) await Book.openCover();
      else if (j === 0 && dir < 0) await Book.closeCover();
      else await Book.flip(dir);

};

Book.flipTime = () => (reducedMotion() ? 0.05 : 0.95);

Book.openCover = async function () {

  Book.beginMove(); Book.spread = 0; Book.emit('spread', 0);
  Book.layoutKeepCover(); Book.frame(false);
  await Tw.run({ dur: Book.flipTime() * 1.1, ease: ease.inOut, update: (k, e) => Book.setCoverAngle(a0 + (Math.PI - a0) * e) });
  Book.setCoverAngle(Math.PI); Book.layout(); Book.afterSettle();
};
Book.closeCover = async function () {

  await Book.hideDio(true);
  Book.beginMove(); Book.spread = -1; Book.emit('spread', -1);
  Book.layoutKeepCover(); Book.frame(false);
  await Tw.run({ dur: Book.flipTime() * 1.1, ease: ease.inOut, update: (k, e) => Book.setCoverAngle(a0 * (1 - e)) });
  Book.setCoverAngle(0); Book.layout(); Book.afterSettle();
};
Book.beginMove = function () { Book.emit('moving'); };
Book.layoutKeepCover = function () {
  const a = Book.coverAngle; Book.layout(); Book.setCoverAngle(a);
};

/** Flip one leaf forward (dir > 0) or backward (dir < 0) */
Book.flip = async function (dir) {

  const fl = Book.leafAt(fromLeaf); if (!fl) { Book.spread = clamp(j + dir, -1, M + 1); Book.layout(); Book.afterSettle(); return; }

  fl.front.castShadow = true;
  const y0 = BK.Y0 + BK.CT + (dir > 0 ? d * nR : d * nL) + BK.LIFT;

/** Jump several spreads: swap stacks at once and run one quick sheet for continuity */
Book.jump = async function (t) {

  await Book.hideDio(true);

  Book.emit('spread', Book.spread);

};

Book.afterSettle = function (instant) {
  Book.busy = false;
  const j = Book.spread, mem = j >= 1 && j <= Book.M ? Book.mems[j - 1] : null;
  Book.curMemId = mem ? mem.id : null;

Book.prefetch = function () {

/* ---------- diorama on the right page ---------- */
Book.showDio = function (instant) {
  const j = Book.spread, mem = j >= 1 && j <= Book.M ? Book.mems[j - 1] : null;
  if (Book.dio && Book.dioFor === (mem && mem.id + ':' + mem.rev + ':' + mem.t)) return;
  Book.hideDio(false);
  if (!mem) { GFX.setDial(Dio.lightAt(0.34), 0.8); Book.frame(false); return; }
  const inst = Dio.build(mem, { child: Book.child });
  const y = BK.Y0 + BK.CT + Book.delta * Book.nR + BK.LIFT + 0.0008;
  inst.group.position.set(BK.PW / 2, y, Book.STAGE_Z);
  Book.group.add(inst.group); Book.dio = inst; Book.dioFor = mem.id + ':' + mem.rev + ':' + mem.t;
  GFX.setDial(inst.light, instant ? 0 : 0.9); inst.applyLamp();
  inst.setPop(0); inst.loadPhotos();
  if (instant) inst.setPop(1); else inst.popUp(1.6, 0.18);
  Book.frame(false);
  GFX.invalidate();
};
Book.hideDio = function (animate) {
  const inst = Book.dio; if (!inst) return Promise.resolve();
  Book.dio = null; Book.dioFor = null;
  const done = () => inst.dispose();
  if (!animate) { done(); return Promise.resolve(); }
  return inst.popDown(0.3).then(done);
};

/* ---------- per-frame ---------- */
Book.tick = function (dt, t) {
  const inst = Book.dio; if (!inst) return false;
  Book.idleAcc += dt; if (Book.idleAcc < 1 / 30) return false;
  const step = Book.idleAcc; Book.idleAcc = 0;
  if (Book.busy || Book.settings && Book.settings.calm) return false;
  return inst.tick(step, t);
};

/* Studio: while the editor is open the diorama stands alone on the table, so each choice can be watched live. */

const Studio = { active: false, inst: null, key: '', catKey: '', child: null, _tick: null, _acc: 0, _saved: null };

Studio.available = () => !!(GFX.ok && Book.ready && App.bookReady);

Studio.frame = function (instant) {
  GFX.setFrame({ x: 0, y: BK.Y0 + 0.55, z: -0.12, w: Dio.W * 1.36, d: Dio.D * 1.18, hh: Dio.H * 1.16 }, !!instant);

Studio.open = function (draft, child) {
  if (!Studio.available() || Studio.active) return false;
  Studio.active = true; Studio.child = child || null;
  Studio._saved = { dial: GFX.dialCur, focus: Book.focus };
  Book.hideDio(false); Book.group.visible = false;

  return JSON.stringify([m.cat, m.pal, Math.round(m.light * 100), m.frame, m.seed, m.title, m.date, m.people.map((p) => p.n + ':' + p.r), m.photos.map((p) => p.id)]);

Studio.show = function (draft, firstTime) {

  const mem = normMemory(Object.assign({ id: 'studio', rev: 0, t: 0 }, draft));

/* App shell: top bar, dock, view switching, 3D stage input (pointer, wheel, keyboard), model building. */

const App = new Emitter();
Object.assign(App, {
  childId: null, view: 'buku', mood: 'day', glOk: false, bookReady: false, model: null, modelSig: '', dirty: true,
  drawerW: 0, entered: false, pendingGoto: null, D: {}, dockEls: null, loadedOnce: false,
});

App.byDate = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || ((a.created || 0) - (b.created || 0)) || a.id.localeCompare(b.id);
App.isMobile = () => window.innerWidth <= 640;

/* ---------- start ---------- */
App.init = function () {
  UI.init();
  const D = App.D;
  D.app = $('#app'); D.gl = $('#gl'); D.top = $('#topbar'); D.view = $('#view'); D.hint = $('#stagehint'); D.fseg = $('#focusseg'); D.dock = $('#dock'); D.tip = $('#hovertip');
  App.mood = lsGet('mood', null) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day');
  D.app.dataset.mood = App.mood;
  Book.settings = { calm: !!lsGet('calm', false) };
  App.glOk = GFX.init(D.gl, { mood: App.mood });
  GFX.fixedQuality = lsGet('quality', 'auto') !== 'auto';
  App.buildDock();
  App.bindGlobal();
  S.on('phase', App.onPhase);
  S.on('change', App.onChange);
  S.on('role', () => { if (App.entered) { App.renderTop(); App.sync(true); } });
  S.on('profiles', () => { App.emit('profiles'); });
  S.on('vault', () => { App.emit('vault'); });
  App.glReady = App.glOk ? App.setupStage() : Promise.resolve(false);
  S.boot();
};

App.setupStage = async function () {
  try { await Pages.fonts(); } catch (e) { /* font pemuat belakangan; halaman tetap bisa digambar */ }
  Book.build(GFX.world);
  Book.quality = GFX.quality;
  Book.group.visible = false;
  GFX.addTicker((dt, t) => Book.tick(dt, t));
  GFX.onQuality = (q) => { Book.setQuality(q); };
  Book.on('spread', () => { App.updateDock(); App.updateFocusSeg(); App.updateHint(); });
  Book.on('focus', () => App.updateFocusSeg());
  Book.on('moving', () => { App.showHint(''); });
  Book.on('settled', () => { App.updateHint(); });
  Book.on('action', (e) => App.onBookAction(e));
  Book.on('photo', (e) => { if (e.mem && e.mem.photos[e.index]) Reader.lightbox(e.mem, e.index, { play: S.isVideo(e.mem.photos[e.index]), story: true }); else if (e.mem) Reader.open(e.mem); });
  App.bindStage();
  App.bookReady = true;
  if (App.entered) App.sync(true);

};

/* ---------- phases ---------- */
App.onPhase = function (p) {
  App.D.app.dataset.phase = p;
  Gate.forPhase(p);
  if (p === 'ready') App.enter(); else App.leave();
};

App.enter = function () {
  if (App.entered) return;
  App.entered = true;
  App.D.top.hidden = false;
  App.renderTop();
  if (S.isLoaded()) App.sync(true); else { App.showHint('Memuat kenangan'); }
};

App.leave = function () {
  if (!App.entered && !UI.stack.length) { App.hideChrome(); return; }
  App.entered = false; App.modelSig = ''; App.model = null; App.childId = null; App.loadedOnce = false;
  UI.stack.slice().forEach((m) => m.close(undefined)); UI.closeMenu();
  if (App.bookReady) { Book.hideDio(false); Book.group.visible = false; GFX.invalidate(); }
  if (typeof Dash !== 'undefined') Dash.hide();
  App.hideChrome();
  App.setViewAttr('buku');
  if (GFX.ok) GFX.pause(false);
};
App.hideChrome = function () {
  const D = App.D;
  D.top.hidden = true; D.dock.hidden = true; D.view.hidden = true; D.hint.hidden = true; D.fseg.hidden = true; D.tip.hidden = true;
};

App.onChange = function (kinds) {
  if (!App.entered || !S.isLoaded()) return;
  if (!App.loadedOnce) { App.loadedOnce = true; App.firstLoad(); }
  App.sync(false);
  if (typeof Dash !== 'undefined') Dash.onData(kinds);
  App.emit('data', kinds);
};

App.firstLoad = function () {
  const saved = lsGet('child', null), list = S.childList();
  App.childId = list.some((c) => c.id === saved) ? saved : (list[0] ? list[0].id : null);
  App.view = App.glOk && lsGet('view', 'buku') !== 'dasbor' && list.length ? 'buku' : 'dasbor';
  App.setViewAttr(App.view);
  if (App.view === 'dasbor') Dash.show();
  setTimeout(() => { if (typeof Manage !== 'undefined') Manage.askWho(); }, 1200);
};

/** reconcile everything with the store */
App.sync = function (force) {
  if (!App.entered) return;
  if (App.loadedOnce === false && S.isLoaded()) { App.loadedOnce = true; App.firstLoad(); }
  if (!S.isLoaded()) return;
  if (!S.children.has(App.childId)) { const l = S.childList(); App.childId = l[0] ? l[0].id : null; if (App.childId) lsSet('child', App.childId); }
  App.renderTop();
  if (App.view === 'buku') App.applyModel(force); else App.dirty = true;
  App.updateDock();

/* ---------- model ---------- */
App.buildModel = function () {
  const ch = S.children.get(App.childId); if (!ch) return null;
  const mems = S.activeMemories(ch.id).filter((m) => m.status !== 'draf').sort(App.byDate);
  const canWrite = S.canWriteNow();
  const sig = [ch.id, ch.rev, ch.t, canWrite ? 1 : 0, S.familyName, mems.map((m) => m.id + ':' + m.rev + ':' + m.t).join(',')].join('|');
  return { child: ch, mems, cover: ch.cover, canWrite, family: S.familyName, sig };
};

App.applyModel = function (force) {
  if (!App.bookReady) return;
  if (Studio.active) { App.dirty = true; return; }
  const m = App.buildModel();
  if (!m) { Book.group.visible = false; GFX.invalidate(); App.showHint(''); return; }
  if (!force && !App.dirty && m.sig === App.modelSig) return;

  else if (k === 'End') Book.goto(Book.M + 1);

  else if ((k === 'e' || k === 'E') && mem && S.canWriteNow()) App.editMemory(mem);
  else if ((k === 'n' || k === 'N') && S.canWriteNow()) App.newMemory();
  else if (k === 't' || k === 'T') App.openToc();
  else if (k === '+' || k === '=') GFX.zoomBy(0.9);
  else if (k === '-' || k === '_') GFX.zoomBy(1.1);
  else if (k === '0') GFX.resetView();

/* ---------- stage input ---------- */
App.bindStage = function () {
  const cv = App.D.gl, tip = App.D.tip, P = new Map();
  let g = null, hoverRAF = 0, hx = 0, hy = 0;
  const pinchDist = () => { const a = Array.from(P.values()); return a.length < 2 ? 0 : Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); };
  const active = () => App.view === 'buku' && App.entered && !UI.stack.length && Book.model;

  cv.addEventListener('pointerdown', (e) => {
    if (!active()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { cv.setPointerCapture(e.pointerId); } catch (x) { /* abaikan */ }
    P.set(e.pointerId, { x: e.clientX, y: e.clientY }); UI.closeMenu();
    if (P.size === 1) g = { x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), moved: false, touch: e.pointerType !== 'mouse', pinch: 0 };
    else if (g) { g.pinch = pinchDist(); g.moved = true; }
    tip.hidden = true;
  });
  cv.addEventListener('pointermove', (e) => {
    if (!active()) return;
    const p = P.get(e.pointerId);
    if (!p) { if (e.pointerType === 'mouse') { hx = e.clientX; hy = e.clientY; if (!hoverRAF) hoverRAF = requestAnimationFrame(hover); } return; }
    p.x = e.clientX; p.y = e.clientY; if (!g) return;
    if (P.size >= 2) { const d = pinchDist(); if (g.pinch > 0 && d > 0) { GFX.zoomBy(clamp(g.pinch / d, 0.9, 1.1)); } g.pinch = d; return; }
    const dx = e.clientX - g.lx, dy = e.clientY - g.ly; g.lx = e.clientX; g.ly = e.clientY;
    if (!g.moved && Math.hypot(e.clientX - g.x0, e.clientY - g.y0) > 8) g.moved = true;
    if (g.moved) { if (g.touch) GFX.dragBy(0, dy * 0.0028); else GFX.dragBy(-dx * 0.0038, dy * 0.0028); }
  });
  const up = (e) => {
    const p = P.get(e.pointerId); if (!p) return;
    P.delete(e.pointerId);
    if (P.size > 0 || !g) { if (!P.size) g = null; return; }
    const gg = g; g = null; GFX.releaseDrag();
    if (e.type === 'pointercancel' || !active()) return;
    const dx = e.clientX - gg.x0, dy = e.clientY - gg.y0, dt = performance.now() - gg.t0;
    if (!gg.moved) { Book.tap(e.clientX, e.clientY); return; }
    if (gg.touch && Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 900) { if (dx < 0) Book.next(); else Book.prev(); }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { tip.hidden = true; GFX.pointer(0, 0); cv.style.cursor = 'default'; } });
  cv.addEventListener('wheel', (e) => { if (!active()) return; e.preventDefault(); GFX.zoomBy(e.deltaY < 0 ? 0.93 : 1.07); }, { passive: false });
  cv.addEventListener('dblclick', (e) => { if (active() && !Book.pick(e.clientX, e.clientY)) GFX.resetView(); });
  function hover() {
    hoverRAF = 0; if (!active()) return;
    const r = Book.hover(hx, hy);
    cv.style.cursor = r.cursor || 'default';
    if (r.label) { tip.textContent = r.label; tip.style.left = hx + 'px'; tip.style.top = hy + 'px'; tip.hidden = false; } else tip.hidden = true;
    const b = cv.getBoundingClientRect(); GFX.pointer(((hx - b.left) / b.width) * 2 - 1, ((hy - b.top) / b.height) * 2 - 1);
  }
};

/* ---------- saving ---------- */
Editor.setBusy = function (ed, on, text) {
  ed.st.busy = on; ed.modal.setBusy(on);
  ed.status.textContent = text || ''; ed.modal.el.classList.toggle('saving', on);
  const sb = ed.modal.btn('save'); if (sb) sb.disabled = on;
};

Editor.save = async function (ed) {
  const st = ed.st; if (st.busy) return;
  const R = ed.refs; R.fTitle.setError(''); R.fDate.setError('');
  const title = st.title.trim();
  if (!title) { R.fTitle.setError('Tulis judul lema.'); R.title.focus(); ed.modal.body.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (!parseYmd(st.date)) { R.fDate.setError('Pilih tanggal yang valid.'); R.date.focus(); return; }
  if (st.items.some((i) => i.busy)) { UI.toast('Tunggu, foto atau video masih diproses.'); return; }
  const added = [];
  Editor.setBusy(ed, true, 'Menyimpan');
  try {
    const items = st.items.filter((i) => i.ref), fresh = items.filter((i) => !i.done);
    let n = 0;
    for (const it of fresh) {
      n++; const noun = S.isVideo(it.pp) ? 'video' : 'foto';
      ed.status.textContent = 'Mengunggah ' + noun + ' ' + n + ' dari ' + fresh.length + ' (terenkripsi)';
      it.ref = await S.commitPhoto(it.pp, (p) => { ed.status.textContent = 'Mengunggah ' + noun + ' ' + n + ' dari ' + fresh.length + ' · ' + Math.round(p * 100) + '%'; });
      it.done = true; it.committed = true; added.push(it);
    }
    ed.status.textContent = 'Menyimpan lema';
    const mh = parseFloat(st.meas.h), mw = parseFloat(st.meas.w);
    const payload = {
      id: st.id, title, date: st.date, cat: st.cat, child: st.child, summary: st.summary.trim(), story: st.story.replace(/\s+$/g, ''), place: st.place.trim(),
      tags: st.tags.slice(), people: st.people.filter((p) => p.n.trim()).map((p) => ({ n: p.n.trim(), r: p.r })), photos: items.map((i) => i.ref),
      meas: (mh > 0 || mw > 0) ? { h: mh > 0 ? mh : 0, w: mw > 0 ? mw : 0 } : null, pal: st.pal, light: st.light, frame: st.frame, seed: st.seed, status: st.status, trashed: 0,
    };
    if (!st.isNew) payload.created = st.created;
    try { await S.saveMemory(payload, st.isNew ? {} : { baseRev: st.baseRev }); }
    catch (e) {
      if (!(e && e.code === 'conflict')) throw e;
      const choice = await Editor.conflict(st.id);
      if (choice === 'overwrite') await S.saveMemory(payload, { baseRev: st.baseRev, force: true });
      else if (choice === 'reload') { for (const it of added) { try { await S.deletePhotoDocs(it.ref); } catch (x) { /* abaikan */ } it.ref = it.pp; it.done = false; it.committed = false; } Editor.setBusy(ed, false); const fresh2 = S.memories.get(st.id); st.dirty = false; ed.modal.close(false); if (fresh2) setTimeout(() => Editor.open({ mem: fresh2 }), 250); return; }
      else throw Object.assign(new Error('dibatalkan'), { code: 'cancelled' });
    }
    for (const ph of st.removed) { try { await S.deletePhotoDocs(ph); } catch (e) { /* foto yatim kecil, abaikan */ } }
    st.dirty = false; Editor.setBusy(ed, false);
    ed.modal.close(true);
    UI.toast(st.status === 'draf' ? 'Draf tersimpan. Terbitkan agar masuk ke buku.' : (st.isNew ? 'Lema baru masuk ke buku.' : 'Perubahan tersimpan.'));
    if (st.status !== 'draf' && App.view === 'buku') App.showMemory(st.id);
  } catch (e) {
    for (const it of added) { try { await S.deletePhotoDocs(it.ref); } catch (x) { /* abaikan */ } it.ref = it.pp; it.done = false; it.committed = false; }
    Editor.setBusy(ed, false);
    if (!(e && e.code === 'cancelled')) Editor.handleSaveError(ed, e);
  }
};

Editor.handleSaveError = function (ed, e) { console.error(e); UI.toast(explainError(e), { kind: 'err' }); };

Editor.conflict = function (id) {
  return new Promise((res) => {
    const cur = S.memories.get(id), who = cur ? S.nameOf(cur.by) : 'seseorang';
    const m = UI.modal({
      title: 'Lema ini baru diubah', size: 'sm', dismissible: false,
      body: h('p', { style: { margin: 0, lineHeight: 1.55, color: 'var(--ink-2)' } }, who + (cur ? ' menyimpan perubahan ' + relTime(cur.t) : ' menyimpan perubahan') + ' saat Anda mengedit. Pilih versi yang dipakai.'),
      actions: [
        { label: 'Muat versi terbaru', onclick: (mm) => mm.close('reload') },
        { label: 'Timpa dengan versi saya', kind: 'danger solid', onclick: (mm) => mm.close('overwrite') },
        { label: 'Kembali ke editor', onclick: (mm) => mm.close('stay') },

/* ===== 63-ui-video.js ===== */
/* ===== Antarmuka video: lencana, pemutar, pratinjau, dan dialog kecilkan video. ===== */

const VideoUI = {};

/** apakah peramban ini sanggup memutar jenis video tersebut */
VideoUI.canPlay = function (mime) {
  try { return !!document.createElement('video').canPlayType(String(mime || '').split(';')[0]); } catch (e) { return true; }
};
VideoUI.durOf = (ph) => (ph && ph.vid ? ph.vid.dur : ph && ph.pv ? ph.pv.dur : 0);
VideoUI.mimeOf = (ph) => (ph && ph.vid ? ph.vid.mime : ph && ph.pv ? ph.pv.mime : '');

/** lencana lama putar di sudut gambar */
VideoUI.badge = (ph) => h('span.vbadge', icon('film', 14), VIDEO.fmtDur(VideoUI.durOf(ph)));
/** tanda putar di tengah gambar (hiasan; yang bisa diketuk adalah tombol di sekitarnya) */
VideoUI.center = () => h('span.vcenter', { 'aria-hidden': 'true' }, h('i', icon('play', 24)));

/** nama berkas yang rapi untuk disimpan */
VideoUI.filename = function (mem, ph) {
  const base = String((mem && mem.title) || 'video').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 40) || 'video';
  return 'kenangan-' + base + (VideoUI.mimeOf(ph) === 'video/mp4' ? '.mp4' : '.webm');
};

/** Pemutar: tampil sebagai gambar sampul dengan tombol putar; videonya baru diunduh saat diputar.
    o: { alt, mem, autoplay }. Mengembalikan { el, play(), destroy() } */
VideoUI.player = function (ph, o) {
  o = o || {};
  const dur = VideoUI.durOf(ph), mime = VideoUI.mimeOf(ph);
  const poster = h('img.vposter', { src: S.thumbURL(ph), alt: o.alt || 'Gambar sampul video' });
  const big = h('button.vbig', { type: 'button', 'aria-label': 'Putar video' + (dur ? ', ' + VIDEO.durWords(dur) : ''), onclick: () => load() }, h('i', icon('play', 34)));
  const say = h('div.vsay', { role: 'status', hidden: true });
  const el = h('div.vplayer', poster, big, say);
  let alive = true, token = 0, vid = null;

  const fail = (msg, withSave) => {
    big.hidden = false; say.hidden = false; say.classList.add('err');
    say.replaceChildren(h('span', msg), withSave ? UI.btn('Simpan video', { sm: true, icon: 'download', onclick: () => VideoUI.save(o.mem, ph) }) : null);
  };
  async function load() {
    const my = ++token;
    big.hidden = true; say.hidden = false; say.classList.remove('err'); say.textContent = 'Memuat video…';
    if (!VideoUI.canPlay(mime)) { fail('Peramban ini belum bisa memutar format video ini (' + String(mime).replace('video/', '').toUpperCase() + '). Simpan videonya lalu buka dengan pemutar di perangkat Anda.', true); return; }
    try {
      const url = await S.videoURL(ph, (f) => { if (alive && my === token) say.textContent = 'Memuat video ' + Math.round(f * 100) + '%'; });
      if (!alive || my !== token) return;
      const v = h('video.vel', { controls: true, playsinline: true, preload: 'auto', poster: S.thumbURL(ph), 'aria-label': o.alt || 'Video' });
      v.src = url;
      const ready = new Promise((res, rej) => {
        v.addEventListener('loadedmetadata', () => res(), { once: true });
        v.addEventListener('error', () => rej(vErr('bad_playback')), { once: true });
        setTimeout(res, 12000);
      });
      await ready;
      if (!alive || my !== token) return;
      if (!isFinite(v.duration)) await VIDEO.fixDuration(v);
      if (!alive || my !== token) return;
      vid = v; el.replaceChildren(v);
      v.addEventListener('error', () => { el.replaceChildren(poster, big, say); fail('Video ini tidak bisa diputar di peramban ini. Simpan videonya lalu buka dengan pemutar di perangkat Anda.', true); }, { once: true });
      v.play().catch(() => { /* pengguna bisa menekan tombol putar sendiri */ });
    } catch (e) {
      if (!alive || my !== token) return;
      console.error(e);
      fail(e && e.code === 'bad_playback' ? 'Video ini tidak bisa diputar di peramban ini. Simpan videonya lalu buka dengan pemutar di perangkat Anda.' : explainError(e), !!(e && e.code === 'bad_playback'));
    }
  }
  const api = {
    el, play: load,
    destroy() { alive = false; token++; if (vid) { try { vid.pause(); vid.removeAttribute('src'); vid.load(); } catch (e) { /* abaikan */ } vid = null; } },
  };
  return api;
};

/** simpan video ke perangkat lewat unduhan */
VideoUI.save = async function (mem, ph) {
  try { const blob = await S.videoBlob(ph); await S.saveFile(VideoUI.filename(mem, ph), blob); UI.toast('Video disimpan.'); }
  catch (e) { UI.fail(e); }
};

/** pratinjau video (mis. dari editor, sebelum diunggah) */
VideoUI.preview = function (ph, title) {
  const pl = VideoUI.player(ph, { alt: title || 'Pratinjau video' });
  const m = UI.modal({ title: title || 'Pratinjau video', size: 'lg', cls: 'vprev', body: pl.el, actions: [{ label: 'Tutup', kind: 'primary', onclick: (mm) => mm.close() }], onClose: () => pl.destroy() });
  return m;
};

/** Tanyakan sebelum mengecilkan video. start(kualitas) dipanggil langsung di dalam ketukan tombol
    (iOS hanya mengizinkan suara bila diputar dari ketukan). -> Promise<hasil|null>; null berarti dibatalkan. */
VideoUI.askShrink = function (info, start) {
  return new Promise((resolve, reject) => {
    const q = UI.select(VIDEO.QUALITY.map((x) => ({ v: x.k, t: x.label + ' (' + x.note + ')' })), info.quality, { 'aria-label': 'Kualitas video' });

      est.textContent = pl ? 'Hasilnya sekitar ' + bytesText(Math.round((pl.vbps + pl.abps) * info.dur / 8 * 0.9)) + '. Prosesnya butuh sekitar ' + VIDEO.durWords(info.dur + 3) + '.' : 'Video ini terlalu panjang untuk dikecilkan.';
    };
    q.addEventListener('change', upd); upd();
    const why = info.tooBig ? 'Video ini ' + bytesText(info.size) + ', sedangkan batas tiap video ' + bytesText(VIDEO.MAX_BYTES) + '.' : 'Format video ini perlu diubah supaya bisa diputar di semua perangkat keluarga.';
    const body = h('div.stack',
      h('p', { style: { margin: 0, lineHeight: 1.55, color: 'var(--ink-2)' } }, why + ' Saya kecilkan dulu di perangkat ini; tidak ada yang dikirim ke mana pun selama proses. Videonya diputar sekali dari awal sampai akhir, jadi biarkan layar ini tetap terbuka.'),
      UI.field('Kualitas', q), est);
    const m = UI.modal({
      title: 'Kecilkan video?', size: 'sm', body,
      actions: [
        { label: 'Batal', onclick: (mm) => mm.close(null) },
        { id: 'go', label: 'Kecilkan dan pakai', kind: 'primary', icon: 'film', onclick: (mm) => {
          let job; try { job = start(q.value); } catch (e) { job = Promise.reject(e); }
          lsSet('vq', q.value); mm.close({ job });
        } },
      ],
    });
    m.done.then((r) => { if (r && r.job) r.job.then(resolve, reject); else resolve(null); });
  });
};

const Reader = { cur: null };

/** show the small image first, then swap to the full one only once it is decoded (no blank flash) */
Reader.swapSrc = function (img, url, alive) {
  const pre = new Image(); pre.decoding = 'async'; pre.src = url;
  const go = () => { if (!alive || alive()) img.src = url; };
  if (pre.decode) pre.decode().then(go, go); else pre.onload = go;
};

Reader.order = () => (App.model && App.model.mems ? App.model.mems : []);

Reader.open = function (mem, opts) {
  opts = opts || {};
  if (Reader.cur) { Reader.cur.modal.close(); }
  const rd = { mem, modal: null };
  const body = h('div.read');
  const render = (m, animate) => {

      m.meas ? h('div.read-sec', h('h3', 'Ukuran hari itu'), h('div.row.wrap', { style: { gap: '8px' } }, m.meas.h ? h('span.chip', 'Tinggi ' + String(m.meas.h).replace('.', ',') + ' cm') : null, m.meas.w ? h('span.chip', 'Berat ' + String(m.meas.w).replace('.', ',') + ' kg') : null)) : null,

  const idx = () => Reader.order().findIndex((x) => x.id === rd.mem.id);
  const go = (d) => { const L = Reader.order(), i = idx(); if (i < 0) return; const n = L[i + d]; if (n) render(n, true); };
  const prev = UI.btn('Sebelumnya', { icon: 'left', onclick: () => go(-1) }), next = UI.btn('Berikutnya', { icon: 'right', onclick: () => go(1) });
  const paintNav = () => { const i = idx(), L = Reader.order(); prev.hidden = next.hidden = i < 0; prev.disabled = i <= 0; next.disabled = i < 0 || i >= L.length - 1; };
  const foot = h('div.row.rnav', prev, next);
  const acts = [];
  acts.push({ label: 'Lihat di buku', icon: 'book', onclick: (m) => { const t = rd.mem; m.close(); if (idx() >= 0 || t.status !== 'draf') App.showMemory(t.id); } });
  if (S.canWriteNow()) acts.push({ label: 'Ubah', icon: 'edit', onclick: (m) => { const t = rd.mem; m.close(); setTimeout(() => App.editMemory(S.memories.get(t.id) || t), 200); } });

  rd.modal = UI.modal({ title: mem.title || 'Tanpa judul', size: 'lg', body, footer: foot, actions: acts, cls: 'reader', focus: 'header.mh button', onClose: () => { if (Reader.cur === rd) Reader.cur = null; } });
  Reader.cur = rd;
  render(mem, false);
  if (opts.photo != null && mem.photos[opts.photo]) setTimeout(() => Reader.lightbox(mem, opts.photo, { play: S.isVideo(mem.photos[opts.photo]) }), 60);
