};


/* ===== 64-ui-viewer.js ===== */
/* Penampil foto dan video layar penuh.
   - foto selalu pas di layar (tidak terpotong), ukuran dihitung dari area yang benar-benar kosong
   - cubit, ketuk dua kali, roda tetikus, atau tombol +/- untuk memperbesar; seret untuk menggeser
   - geser ke samping untuk berpindah foto (foto berikutnya ikut bergerak), geser ke bawah/atas untuk menutup
   - ketuk sekali (layar sentuh) menyembunyikan atau menampilkan kendali
   Dipanggil: Reader.lightbox(lema, indeksAwal, { play, story, photos, title }) */
(() => {
  const GAP = 24;        /* jarak antar foto saat digeser (px) */
  const ZMAX = 4;        /* perbesaran terbesar */
  const DBL = 300;       /* batas waktu ketuk dua kali (ms) */
  const SLOP = 8;        /* jarak minimal sebelum sentuhan dianggap geseran (px) */
  const SLIDE = 280;     /* lama animasi pindah foto (ms) */
  const fileSlug = (s, d) => String(s || d).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().slice(0, 40) || d;
  const aspectOf = (ph) => (ph.w && ph.h ? ph.w / ph.h : ph.vid && ph.vid.w && ph.vid.h ? ph.vid.w / ph.vid.h : 16 / 9);
  const velocity = (list) => {
    if (list.length < 2) return { x: 0, y: 0 };
    const b = list[list.length - 1]; let a = list[0];
    for (let k = list.length - 2; k >= 0; k--) { if (b.t - list[k].t > 90) break; a = list[k]; }
    const dt = Math.max(1, b.t - a.t); return { x: (b.x - a.x) / dt, y: (b.y - a.y) / dt };
  };

  Reader.lightbox = function (mem, start, lo) {
    lo = lo || {};
    const photos = lo.photos || (mem && mem.photos) || []; if (!photos.length) return null;
    const title = lo.title || (mem && mem.title) || 'Foto';
    const n = photos.length, reduced = reducedMotion(), touch = isTouch();
    let i = clamp(start || 0, 0, n - 1), closed = false, lastType = 'mouse', hideT = 0, tapT = 0, animT = 0, pending = -1, lastTap = null, g = null;
    const st = { w: 0, h: 0, padT: 0, padB: 0, over: false, z: 1, tx: 0, ty: 0, dx: 0, dy: 0, chrome: true };
    const slides = new Map(), ptrs = new Map(), timers = new Set();
    const later = (fn, ms) => { const t = setTimeout(() => { timers.delete(t); fn(); }, ms); timers.add(t); return t; };
    const anyCap = photos.some((p) => p.cap);
    const metaText = [mem && mem.date ? fmtDate(mem.date) : '', mem && mem.place ? mem.place : ''].filter(Boolean).join(' · ');

    /* ---------- bagian layar ---------- */
    const count = h('span.lbcount', { 'aria-hidden': 'true' });
    const say = h('div.sr-only', { role: 'status', 'aria-live': 'polite' });
    const bZout = h('button.btn.quiet.icon.lbzoom', { type: 'button', 'aria-label': 'Perkecil', title: 'Perkecil (tombol -)', onclick: () => zoomBy(1 / 1.6) }, icon('minus', 20));
    const bZin = h('button.btn.quiet.icon.lbzoom', { type: 'button', 'aria-label': 'Perbesar', title: 'Perbesar (tombol +)', onclick: () => zoomBy(1.6) }, icon('plus', 20));
    const bSave = S.caps.downloads ? h('button.btn.quiet.icon', { type: 'button', 'aria-label': 'Simpan foto ini', title: 'Simpan foto ini', onclick: () => save() }, icon('download', 20)) : null;
    const tools = h('div.lbtools', count, bZout, bZin, bSave);

    const track = h('div.lbtrack');
    const stage = h('div.lbstage', { role: 'group', 'aria-roledescription': 'galeri foto', 'aria-label': title }, track);
    const spin = h('span.spin.lbspin', { hidden: true, 'aria-hidden': 'true' });
    const bPrev = h('button.lbnav.l', { type: 'button', 'aria-label': 'Foto sebelumnya', onclick: () => go(i - 1) }, icon('left', 26));
    const bNext = h('button.lbnav.r', { type: 'button', 'aria-label': 'Foto berikutnya', onclick: () => go(i + 1) }, icon('right', 26));
    const cap = h('div.lbcap'), meta = h('div.lbmeta');
    const bStory = lo.story ? h('button.btn.sm.lbstory', { type: 'button', onclick: () => { const mm = m; mm.close(); later(() => Reader.open(mem), 180); } }, icon('book', 16), 'Baca cerita') : null;
    const thumbs = n > 1 ? h('div.lbthumbs', { role: 'group', 'aria-label': 'Daftar foto' }, photos.map((ph, k) => h('button.lbth', { type: 'button', 'aria-label': (S.isVideo(ph) ? 'Video ' : 'Foto ') + (k + 1) + ' dari ' + n, onclick: () => go(k) },
      h('img', { src: S.thumbURL(ph), alt: '', draggable: 'false' }), S.isVideo(ph) ? h('span.lbplay', icon('play', 11)) : null))) : null;
    const info = h('div.lbinfo' + (anyCap ? '.hascap' : ''), h('div.lbtext', h('div.lbtxt', cap, meta), bStory), thumbs);
    const body = h('div.lbwrap', { tabindex: '-1' }, stage, n > 1 ? [bPrev, bNext] : null, spin, info, say);

    const m = UI.modal({ title, cls: 'lb', noScrim: true, body, headerExtra: tools, focus: '.lbwrap', onClose: () => teardown() });
    const hdr = $('header.mh', m.el);
    const cur = () => slides.get(i);

    /* ---------- ukuran dan letak ---------- */
    const box = () => ({ w: st.w, h: Math.max(60, st.h - st.padT - st.padB) });
    const measure = () => {
      const r = stage.getBoundingClientRect(); st.w = Math.round(r.width); st.h = Math.round(r.height);
      st.over = st.h <= 480;
      m.el.classList.toggle('lbover', st.over);
      st.padT = st.over ? 0 : Math.round(hdr.getBoundingClientRect().height);
      st.padB = st.over ? 0 : Math.round(info.getBoundingClientRect().height);
      m.el.style.setProperty('--lbpt', st.padT + 'px'); m.el.style.setProperty('--lbpb', st.padB + 'px');
    };
    const fit = (s) => {
      const b = box(), w0 = s.ph.w || 0, h0 = s.ph.h || 0;
      let sc = Math.min(b.w / (w0 || s.ar * 1000), b.h / (h0 || 1000));
      if (w0 && h0 && !s.isV) sc = Math.min(sc, 2); /* foto kecil tidak dibesarkan lebih dari dua kali */
      const fw = Math.round((w0 || s.ar * 1000) * sc), fh = Math.round((h0 || 1000) * sc);
      s.fw = fw; s.fh = fh;
      const el = s.img || s.vbox; if (!el) return;
      Object.assign(el.style, { width: fw + 'px', height: fh + 'px', left: Math.round((b.w - fw) / 2) + 'px', top: Math.round(st.padT + (b.h - fh) / 2) + 'px' });
    };
    const limits = (z) => {
      const s = cur(); if (!s || s.isV) return { x: 0, y: 0 };
      const b = box(); return { x: Math.max(0, (s.fw * z - b.w) / 2), y: Math.max(0, (s.fh * z - b.h) / 2) };
    };
    const clampT = () => { const L = limits(st.z); st.tx = clamp(st.tx, -L.x, L.x); st.ty = clamp(st.ty, -L.y, L.y); };
    const center = () => { const b = box(); return { x: b.w / 2, y: st.padT + b.h / 2 }; };

    const place = () => {
      const prog = Math.min(Math.abs(st.dy) / (st.h * 0.45 || 1), 1);
      slides.forEach((s) => {
        const isCur = s.k === i, off = (s.k - i) * (st.w + GAP) + st.dx;
        s.el.style.transform = 'translate3d(' + off + 'px,' + (isCur ? st.dy : 0) + 'px,0)' + (isCur && st.dy ? ' scale(' + (1 - prog * 0.18).toFixed(4) + ')' : '');
        if (s.img) s.img.style.transform = isCur && (st.z !== 1 || st.tx || st.ty) ? 'translate3d(' + st.tx + 'px,' + st.ty + 'px,0) scale(' + st.z + ')' : '';
      });
      m.el.style.setProperty('--lba', (1 - prog * 0.9).toFixed(3));
    };
    const tween = (ms) => { stage.classList.add('anim'); place(); clearTimeout(animT); animT = later(() => stage.classList.remove('anim'), (ms || SLIDE) + 30); };
    const paintZoom = () => {
      const z = st.z > 1.02; stage.classList.toggle('zoomed', z);
      bZout.disabled = st.z <= 1.001; bZin.disabled = st.z >= ZMAX - 0.001;
    };

    /* ---------- foto dan video per lembar ---------- */
    const paintSpin = () => { const s = cur(); spin.hidden = !(s && s.state === 'loading'); };
    const loadFull = (s) => {
      s.state = 'loading'; paintSpin();
      S.photoURL(s.ph).then((u) => {
        const pre = new Image(); pre.decoding = 'async'; pre.src = u;
        const go2 = () => { if (closed || slides.get(s.k) !== s) return; s.img.src = u; s.state = 'done'; paintSpin(); };
        if (pre.decode) pre.decode().then(go2, go2); else pre.onload = go2;
      }).catch((e) => {
        if (closed || slides.get(s.k) !== s) return;
        s.state = 'error'; paintSpin(); s.el.append(h('div.lberr', 'Foto ini tidak bisa dimuat.'));
        if (s.k === i) UI.toast(explainError(e), { kind: 'err' });
      });
    };
    const mkPlayer = (s) => {
      s.player = VideoUI.player(s.ph, { alt: s.ph.cap || 'Video ' + (s.k + 1) + ' dari ' + title, mem }); s.vbox.replaceChildren(s.player.el);
    };
    const makeSlide = (k) => {
      const ph = photos[k], isV = S.isVideo(ph);
      const s = { k, ph, isV, ar: aspectOf(ph), el: h('div.lbslide'), img: null, vbox: null, player: null, state: 'done', fw: 0, fh: 0 };
      if (isV) { s.vbox = h('div.lbvbox'); s.el.append(s.vbox); mkPlayer(s); }
      else {
        s.img = h('img.lbimg', { src: S.thumbURL(ph), alt: ph.cap || 'Foto ' + (k + 1) + ' dari ' + title, draggable: 'false', decoding: 'async' });
        s.el.append(s.img);
      }
      track.append(s.el); slides.set(k, s); fit(s);
      if (!isV) loadFull(s);
      return s;
    };
    const dropSlide = (s) => { if (s.player) { s.player.destroy(); s.player = null; } s.el.remove(); slides.delete(s.k); };
    const resetVideo = (s) => { if (s.player) { s.player.destroy(); mkPlayer(s); } };

    const warm = () => { [i - 2, i + 2].forEach((k) => { if (k >= 0 && k < n && !S.isVideo(photos[k])) S.photoURL(photos[k]).catch(() => { /* dimuat saat dibuka */ }); }); };
    const centerThumb = () => {
      if (!thumbs) return; const b = thumbs.children[i]; if (!b) return;
      $$('.lbth', thumbs).forEach((x, k) => { if (k === i) x.setAttribute('aria-current', 'true'); else x.removeAttribute('aria-current'); });
      thumbs.scrollTo({ left: b.offsetLeft - (thumbs.clientWidth - b.offsetWidth) / 2, behavior: reduced ? 'auto' : 'smooth' });
    };
    const paintText = () => {
      const ph = photos[i];
      count.textContent = n > 1 ? (i + 1) + ' / ' + n : '';
      cap.textContent = ph.cap || '';
      meta.textContent = [S.isVideo(ph) ? 'Video · ' + VIDEO.fmtDur(VideoUI.durOf(ph)) : '', metaText].filter(Boolean).join(' · ');
    };
    const paintUi = () => {
      const s = cur(), ph = photos[i], isV = !!(s && s.isV);
      paintText();
      bPrev.disabled = i === 0; bNext.disabled = i === n - 1;
      if (bSave) { const t = isV ? 'Simpan video ini' : 'Simpan foto ini'; bSave.setAttribute('aria-label', t); bSave.title = t; }
      say.textContent = (isV ? 'Video ' : 'Foto ') + (i + 1) + ' dari ' + n + (ph.cap ? '. ' + ph.cap : '');
      paintZoom(); paintSpin(); centerThumb();
      slides.forEach((x) => { x.el.inert = x.k !== i; x.el.setAttribute('aria-hidden', x.k === i ? 'false' : 'true'); });
    };
    const sync = () => {
      Array.from(slides.values()).forEach((s) => { if (Math.abs(s.k - i) > 1) dropSlide(s); });
      [i - 1, i, i + 1].forEach((k) => { if (k >= 0 && k < n && !slides.has(k)) makeSlide(k); });
      place(); paintUi(); warm();
    };

    /* ---------- pindah foto ---------- */
    const commit = (k) => {
      clearTimeout(animT); stage.classList.remove('anim'); pending = -1;
      const old = slides.get(i); if (old && old.isV && k !== i) resetVideo(old);
      i = k; st.dx = 0; st.dy = 0; st.z = 1; st.tx = 0; st.ty = 0; sync();
    };
    const finishAnim = () => { if (pending >= 0) commit(pending); };
    const snapBack = () => { st.dx = 0; st.dy = 0; tween(220); if (g === null) m.el.classList.toggle('chromeoff', !st.chrome); };
    const go = (k) => {
      finishAnim();
      if (k < 0 || k >= n || k === i) return;
      const d = k - i;
      if (Math.abs(d) > 1 || reduced) { commit(k); return; }
      pending = k; stage.classList.add('anim'); st.dx = -d * (st.w + GAP); place();
      clearTimeout(animT); animT = later(() => commit(k), SLIDE + 20);
    };

    /* ---------- perbesar ---------- */
    const zoomAt = (z2, p, animate) => {
      const s = cur(); if (!s || s.isV) return;
      z2 = clamp(z2, 1, ZMAX); const c = center();
      const qx = (p.x - c.x - st.tx) / st.z, qy = (p.y - c.y - st.ty) / st.z;
      st.z = z2; st.tx = p.x - c.x - qx * z2; st.ty = p.y - c.y - qy * z2; clampT();
      if (z2 <= 1.001) { st.z = 1; st.tx = 0; st.ty = 0; }
      if (animate && !reduced) tween(240); else place();
      paintZoom();
    };
    const zoomBy = (f) => { const c = center(); zoomAt(st.z * f, c, true); };
    const zTarget = (s) => { const b = box(), fill = Math.max(b.w / s.fw, b.h / s.fh); return fill >= 1.15 ? clamp(Math.max(fill, 2), 2, ZMAX) : 2.5; };
    const toggleZoom = (p) => { const s = cur(); if (!s || s.isV) return; if (st.z > 1.05) zoomAt(1, center(), true); else zoomAt(zTarget(s), p, true); };
    const panBy = (dx, dy) => { st.tx += dx; st.ty += dy; clampT(); place(); };

    /* ---------- kendali yang bisa disembunyikan ---------- */
    const setChrome = (on) => { st.chrome = on; m.el.classList.toggle('chromeoff', !on); armHide(); };
    const armHide = () => { clearTimeout(hideT); if (st.chrome && st.over && touch) hideT = later(() => setChrome(false), 3400); };
    m.el.addEventListener('focusin', (e) => { if (!st.chrome && e.target !== body) setChrome(true); });

    /* ---------- sentuhan dan tetikus ---------- */
    const rel = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const resist = (d) => ((i === 0 && d > 0) || (i === n - 1 && d < 0) ? d * 0.3 : d);

    stage.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      lastType = e.pointerType || 'mouse';
      if (e.target && e.target.closest && e.target.closest('video')) return; /* pemutar punya kendali sendiri */
      if (pending >= 0) finishAnim();
      stage.classList.remove('anim');
      const p = rel(e); p.t = performance.now(); ptrs.set(e.pointerId, p);
      if (ptrs.size === 1) {
        g = { id: e.pointerId, type: lastType, x0: p.x, y0: p.y, tx0: st.tx, ty0: st.ty, mode: null, moved: false, target: e.target, samples: [{ x: p.x, y: p.y, t: p.t }] };
      } else if (ptrs.size === 2 && g) {
        const s = cur(); if (!s || s.isV) return;
        const [a, b] = Array.from(ptrs.values()), c = center(), mp = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        g.mode = 'pinch'; g.moved = true; g.d0 = Math.max(12, dist(a, b)); g.z0 = st.z;

      }
    });

      const p = ptrs.get(e.pointerId); if (!p || !g) return;

      if (g.mode === 'pinch') {
        if (ptrs.size < 2) return;
        const [a, b] = Array.from(ptrs.values()), c = center(), mp = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const z2 = clamp(g.z0 * dist(a, b) / g.d0, 1, ZMAX);
        st.z = z2; st.tx = mp.x - c.x - g.qx * z2; st.ty = mp.y - c.y - g.qy * z2; clampT(); place(); paintZoom(); return;
      }

        g.moved = true;
        const adx = Math.abs(q.x - g.x0), ady = Math.abs(q.y - g.y0);
        g.mode = st.z > 1.02 ? 'pan' : adx >= ady * 0.9 ? 'swipe' : 'dismiss';
        g.x0 = q.x; g.y0 = q.y; g.tx0 = st.tx; g.ty0 = st.ty;
        try { stage.setPointerCapture(e.pointerId); } catch (x) { /* abaikan */ }
        if (g.mode === 'dismiss') { m.el.classList.add('chromeoff'); }
        if (g.mode === 'pan') stage.classList.add('panning');
        clearTimeout(tapT); lastTap = null;

/* Dasbor pengelolaan kenangan: kerangka, tab, dan tab Ringkasan.

const Dash = {
  sec: 'ringkasan', active: false, root: null, head: null, tabs: null, body: null, dispose: null, sections: {}, _t: 0,
  /* penyaring daftar lema; 'cur' = anak yang sedang dibuka, 'all' = semua anak */

/* ---------- kerangka ---------- */
Dash.build = function () {

  tabs.addEventListener('keydown', (e) => {
    const k = e.key, L = DASH_TABS.map((t) => t.k); let i = L.indexOf(Dash.sec);
    if (k === 'ArrowRight') i = (i + 1) % L.length; else if (k === 'ArrowLeft') i = (i - 1 + L.length) % L.length; else if (k === 'Home') i = 0; else if (k === 'End') i = L.length - 1; else return;

/* ---------- usia dalam bulan ---------- */
const monthsText = (mo) => { if (mo < 12) return mo + ' bulan'; const y = Math.floor(mo / 12), r = mo % 12; return r ? y + ' tahun ' + r + ' bulan' : y + ' tahun'; };

function dateAtAge(birth, months) {
  const b = parseYmd(birth); if (!b) return todayYmd();
  const d = toYmd(new Date(b.y, b.m - 1 + months, b.d + 14)), t = todayYmd();
  return d > t ? t : d;
}
const elapsedMs = (ms) => Date.now() - ms;

/* ---------- hitungan untuk ringkasan ---------- */
Dash.stats = function (ch) {
  const today = todayYmd(), all = Array.from(S.memories.values()).filter((m) => m.child === ch.id);
  const live = all.filter((m) => !m.trashed), pub = live.filter((m) => m.status !== 'draf'), drafts = live.filter((m) => m.status === 'draf');
  const age = ageBetween(ch.birth, today), cur = age && !age.neg ? age.months : -1;
  const byCat = new Map(CATS.map((c) => [c.k, []]));
  pub.forEach((m) => { (byCat.get(m.cat) || byCat.get('spesial')).push(m); });
  const authors = new Map(); live.forEach((m) => authors.set(m.by || '', (authors.get(m.by || '') || 0) + 1));
  /* peta usia: tong 1, 2, 3, 6 atau 12 bulan agar paling banyak 30 batang */
  let maxM = Math.max(0, cur); const pre = []; let undated = 0;
  pub.forEach((m) => { const a = ageBetween(ch.birth, m.date); if (!a) { undated++; return; } if (a.neg) pre.push(m); else maxM = Math.max(maxM, a.months); });
  const span = maxM + 1, w = [1, 2, 3, 6, 12].find((x) => Math.ceil(span / x) <= 30) || 12, n = Math.ceil(span / w);
  const bins = Array.from({ length: n }, (_, i) => ({ from: i * w, to: i * w + w - 1, mems: [] }));
  pub.forEach((m) => { const a = ageBetween(ch.birth, m.date); if (a && !a.neg) bins[Math.floor(a.months / w)].mems.push(m); });
  /* celah terpanjang sampai usia sekarang */
  let gap = null;
  if (cur >= 0 && pub.length) {
    const cb = Math.min(n - 1, Math.floor(cur / w)); let run = null;
    const close = () => { if (run && (run.to - run.from + 1) * w >= 2 && (!gap || run.to - run.from > gap.to - gap.from)) gap = run; run = null; };
    for (let i = 0; i <= cb; i++) { if (bins[i].mems.length === 0) { if (!run) run = { from: i, to: i }; else run.to = i; } else close(); }
    close();
    if (gap) gap = { from: gap.from * w, to: Math.min(cur, gap.to * w + w - 1) };
  }
  return {
    ch, today, age, cur, all, live, pub, drafts, trash: all.filter((m) => m.trashed), byCat, authors, bins, w, span, pre, undated, gap,
    photos: live.reduce((s, m) => s + m.photos.length - S.videoCount(m.photos), 0), videos: live.reduce((s, m) => s + S.videoCount(m.photos), 0),
    added30: pub.filter((m) => m.created && elapsedMs(m.created) < 30 * 864e5).length,
    recent: live.slice().sort((a, b) => (b.t || 0) - (a.t || 0)).slice(0, 5),
  };
};

/** ide lema: yang cocok dengan usia sekarang dan yang mungkin terlewat di usia sebelumnya */
Dash.ideas = function (D) {
  if (D.cur < 0) return { now: [], missed: [] };
  const used = new Set(D.live.map((m) => (m.title || '').trim().toLowerCase())), free = SUGGESTIONS.filter((x) => !used.has(x.t.toLowerCase()));

/* ===== 66-viz.js ===== */
/* Viz: small dependency-free charts built from HTML.
   One hue, thin marks, a hover/keyboard layer and a table twin for every chart. Labels are untrusted text: textContent only. */

const Viz = {};

/** top of the value axis: even, so the middle tick is a whole number */
Viz.niceTop = function (max) {
  if (max <= 2) return 2;
  if (max <= 4) return 4;
  if (max <= 6) return 6;
  return Math.ceil(max / 4) * 4;
};

/** accessible table twin of a chart */
Viz.table = function (cols, rows, caption) {
  return h('div.vtab', { hidden: true }, h('table',
    caption ? h('caption.sr-only', caption) : null,
    h('thead', h('tr', cols.map((c) => h('th', { scope: 'col' }, c)))),
    h('tbody', rows.map((r) => h('tr', r.map((c, i) => (i === 0 ? h('th', { scope: 'row' }, c) : h('td', c))))))));
};

/** card-less figure: title, optional subtitle, chart body, table toggle */
Viz.figure = function (o, body, table) {
  const tog = h('button.btn.quiet.sm.vt', { type: 'button', 'aria-pressed': 'false' }, icon('list', 16), h('span', 'Lihat tabel'));
  tog.addEventListener('click', () => {
    const on = tog.getAttribute('aria-pressed') !== 'true';
    tog.setAttribute('aria-pressed', String(on)); tog.lastChild.textContent = on ? 'Lihat grafik' : 'Lihat tabel';
    body.hidden = on; table.hidden = !on;
  });
  return h('figure.viz', h('figcaption.vh', h('div.vhead', h('h3', o.title), tog), o.sub ? h('p.vsub', o.sub) : null), body, table);
};

/**
 * Column chart (one series). bins: [{label, full, value, items:[text], tick, act}]
 * o: {title, sub, unit, height, caption, aria}
 */
Viz.columns = function (o) {
  const bins = o.bins, n = bins.length, max = Math.max(1, ...bins.map((b) => b.value));
  const top = Viz.niceTop(max), mid = top / 2, ticks = [0, mid, top];
  const live = h('div.sr-only', { 'aria-live': 'polite' });
  const cols = h('div.vcols', {
    role: 'group', tabindex: '0', 'aria-label': (o.aria || o.title) + '. Gunakan panah kiri dan kanan untuk menelusuri.',
    style: { gridTemplateColumns: 'repeat(' + n + ',minmax(0,1fr))' },
  });
  const tip = h('div.vtip', { role: 'tooltip', hidden: true });
  const cells = bins.map((b, i) => h('div.vc' + (b.value > 0 ? '.has' : ''), { dataset: { i: String(i) } },
    b.value > 0 ? h('b.vbar', { style: { height: (b.value / top * 100) + '%' } }) : null,
    b.tick != null ? h('span.vtick', String(b.tick)) : null));
  cols.append(...cells);
  const plot = h('div.vplot', { style: { '--vh': (o.height || 168) + 'px' } },
    h('div.vy', ticks.map((v) => h('span', { style: { bottom: (v / top * 100) + '%' } }, String(v)))),
    h('div.vgrid', ticks.map((v) => h('i' + (v === 0 ? '.base' : ''), { style: { bottom: (v / top * 100) + '%' } }))),
    cols, tip);

  let cur = -1, ptype = 'mouse', lastTap = -1;
  const hide = () => { if (cur >= 0 && cells[cur]) cells[cur].classList.remove('on'); cur = -1; tip.hidden = true; };
  const show = (i, announce) => {
    if (i === cur) return;
    if (cur >= 0 && cells[cur]) cells[cur].classList.remove('on');
    cur = i; const b = bins[i], c = cells[i]; c.classList.add('on');
    tip.replaceChildren(
      h('div.tv', h('span.key'), h('b', String(b.value)), ' ' + o.unit),
      h('div.tl', b.full || b.label),
      b.items && b.items.length ? h('ul', b.items.slice(0, 3).map((t) => h('li', t)), b.items.length > 3 ? h('li.more', '+' + (b.items.length - 3) + ' lainnya') : null) : null,
      b.act && b.value ? h('div.th', ptype === 'mouse' ? 'Klik untuk melihat daftarnya' : 'Ketuk lagi untuk melihat daftarnya') : null);
    tip.hidden = false;
    const pr = plot.getBoundingClientRect(), cr = c.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    const barTop = cr.bottom - (b.value / top) * cr.height - pr.top;
    const x = clamp(cr.left + cr.width / 2 - pr.left, tw / 2 + 2, pr.width - tw / 2 - 2);
    let y = barTop - 10 - th; if (y < -th * 0.6) y = barTop + 10;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
    if (announce) live.textContent = (b.full || b.label) + ': ' + b.value + ' ' + o.unit;
  };
  cells.forEach((c, i) => {
    c.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { ptype = 'mouse'; show(i, false); } });
    c.addEventListener('pointerdown', (e) => { ptype = e.pointerType || 'mouse'; if (ptype !== 'mouse') { const same = cur === i; show(i, false); lastTap = same ? i : -1; } });
    c.addEventListener('click', () => {
      const b = bins[i]; if (!b.act || !b.value) return;
      if (ptype !== 'mouse' && lastTap !== i) return;
      b.act(b);
    });
  });
  cols.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hide(); });
  cols.addEventListener('focus', () => { if (cur < 0) { let k = n - 1; for (let j = n - 1; j >= 0; j--) if (bins[j].value > 0) { k = j; break; } ptype = 'mouse'; show(k, true); } });
  cols.addEventListener('blur', hide);
  cols.addEventListener('keydown', (e) => {
    const k = e.key; let i = cur < 0 ? n - 1 : cur;
    if (k === 'ArrowRight') i = Math.min(n - 1, i + 1);
    else if (k === 'ArrowLeft') i = Math.max(0, i - 1);
    else if (k === 'Home') i = 0;
    else if (k === 'End') i = n - 1;
    else if (k === 'Enter' || k === ' ') { const b = bins[cur]; if (b && b.act && b.value) { e.preventDefault(); b.act(b); } return; }
    else if (k === 'Escape') { hide(); return; }
    else return;
    e.preventDefault(); ptype = 'mouse'; show(i, true);
  });

  const body = h('div.vbody', plot, o.caption ? h('p.vcap', o.caption) : null, live);
  const table = Viz.table(o.tableCols || ['Periode', 'Jumlah', 'Judul'], bins.map((b) => [b.full || b.label, String(b.value), (b.items || []).join('; ') || '–']), o.title);
  return Viz.figure(o, body, table);
};

/**
 * Horizontal bars (one series, nominal categories). rows: [{label, value, act}]
 * o: {title, sub, unit, actHint}
 */
Viz.hbars = function (o) {
  const rows = o.rows, max = Math.max(1, ...rows.map((r) => r.value));
  const list = h('ul.hbars', rows.map((r) => {
    const inner = [h('span.hl.ellipsis', { title: r.label }, r.label), h('span.hb', { style: { '--p': String(r.value / max) } }, h('i'), h('b', String(r.value)))];
    return h('li', r.act
      ? h('button.hrow', { type: 'button', 'aria-label': r.label + ': ' + r.value + ' ' + o.unit + '. ' + (o.actHint || ''), onclick: () => r.act(r) }, inner)
      : h('div.hrow', { role: 'img', 'aria-label': r.label + ': ' + r.value + ' ' + o.unit }, inner));
  }));
  const body = h('div.vbody', list);
  const table = Viz.table(o.tableCols || ['Nama', 'Jumlah'], rows.map((r) => [r.label, String(r.value)]), o.title);
  return Viz.figure(o, body, table);
};

/** meter: a ratio against a limit, the track is a light step of the same hue */
Viz.meter = function (v, max, label) {
  return h('div.meter2', { role: 'meter', 'aria-valuemin': '0', 'aria-valuemax': String(max), 'aria-valuenow': String(v), 'aria-label': label }, h('i', { style: { width: (max ? clamp(v / max, 0, 1) * 100 : 0) + '%' } }));
};

/** stat tile: label, value (proportional figures), optional caption / delta / meter / action */
Viz.tile = function (o) {
  return h('div.tile' + (o.hero ? '.hero' : ''), o.cls ? { class: o.cls } : null,
    h('div.tl', o.label),
    h('div.tv', String(o.value), o.unit ? h('small', ' ' + o.unit) : null),
    o.meter || null,
    o.delta ? h('div.dlt' + (o.delta.flat ? '.flat' : ''), o.delta.flat ? null : icon('up', 15), h('span', o.delta.text)) : null,
    o.caption ? h('div.tc', o.caption) : null,
    o.action ? h('div.ta', o.action) : null);
};

Manage.markdown = function () {
  const out = ['# ' + (S.familyName || 'Ensiklopedia Kenangan Anak'), '', '_Diekspor ' + fmtDate(todayYmd()) + '. Berkas ini tidak disandikan: simpan di tempat yang aman._', ''];
  S.childList().forEach((c) => {
    out.push('## ' + (c.name || c.nick), '', 'Lahir ' + fmtDate(c.birth), '');
    if (c.preface) out.push('> ' + c.preface.replace(/\s*\n+\s*/g, ' '), '');
    S.activeMemories(c.id).filter((m) => m.status !== 'draf').sort(App.byDate).forEach((m) => {
      const a = ageBetween(c.birth, m.date);
      out.push('### ' + (m.title || 'Tanpa judul'), '', '*' + [fmtDate(m.date), a && !a.neg ? 'usia ' + ageText(c.birth, m.date, { long: true }) : '', catOf(m.cat).label, m.place].filter(Boolean).join(' · ') + '*', '');
      if (m.summary) out.push('**' + m.summary + '**', '');
      if (m.story.trim()) out.push(m.story.trim(), '');
      if (m.people.length) out.push('Yang hadir: ' + m.people.map((p) => p.n + (p.n.toLowerCase() !== relOf(p.r).label.toLowerCase() ? ' (' + relOf(p.r).label.toLowerCase() + ')' : '')).join(', '), '');
      if (m.meas) out.push('Ukuran hari itu: ' + [m.meas.h ? 'tinggi ' + String(m.meas.h).replace('.', ',') + ' cm' : '', m.meas.w ? 'berat ' + String(m.meas.w).replace('.', ',') + ' kg' : ''].filter(Boolean).join(', '), '');
      if (m.tags.length) out.push(m.tags.map((t) => '#' + t).join(' '), '');
      if (m.photos.length) { const nv = S.videoCount(m.photos); out.push('_' + [m.photos.length - nv ? (m.photos.length - nv) + ' foto' : '', nv ? nv + ' video' : ''].filter(Boolean).join(' dan ') + ' ada di buku._', ''); }

/* ===== 69-cvs-core.js ===== */
/* Studio sampul, bagian inti: keadaan sesi, riwayat urung/ulang, penggambaran kanvas rancang, pemilihan barang, gestur seret, ubah ukuran, putar.
   Tampilan (modal, tab, simpan, pratinjau 3D) ada di 69-cvs-panels.js dan 69-cvs-ui.js. */

const CoverStudio = { cur: null };

(() => {
  const { DW, DH, SHAPE } = CoverArt;
  const RAD = Math.PI / 180, CX = 536, CY = DH / 2, SNAP = 10;
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const isBleed = (it) => !!it && it.t === 'photo' && it.shape === 'penuh' && !!it.ph;
  const normAng = (a) => { a = (((a + 180) % 360) + 360) % 360 - 180; return a === -180 ? 180 : a; };
  const r1 = (v) => Math.round(v * 10) / 10;
  const r3 = (v) => Math.round(v * 1000) / 1000;

  class Session extends Emitter {
    constructor(child) {
      super();
      this.child = child; this.id = child.id;
      this.cv = clone(CoverArt.resolve(child));
      this.base = JSON.stringify(this.cv);
      this.hist = []; this.fut = []; this.lastKey = ''; this.lastT = 0;
      this.sel = null; this.tab = 'letak'; this.crop = false; this.stkCat = '';
      this.local = new Map(); /* foto baru dari perangkat yang belum diunggah: id -> hasil S.prepPhoto */
      this.view = { cssW: 0, cssH: 0, k: 1, pw: 0, ph: 0 };
      this.dom = null; this.raf = 0; this.busy = false; this.closed = false; this.peek = false;
    }

    /* ---------- akses ---------- */
    item(id) { return this.cv.items.find((i) => i.id === id) || null; }
    selItem() { return this.sel ? this.item(this.sel) : null; }
    snap() { return JSON.stringify(this.cv); }
    isDirty() { return this.snap() !== this.base; }
    count(t) { return this.cv.items.filter((i) => i.t === t).length; }
    hasPhoto() { return this.cv.items.some((i) => i.t === 'photo' && i.ph); }
    firstPh() { const p = this.cv.items.find((i) => i.t === 'photo' && i.ph); return p ? p.ph : null; }
    /** desain masih persis bawaan (tanpa perubahan apa pun selain id) */
    untouched() {
      const strip = (cv) => JSON.stringify(Object.assign({}, cv, { items: cv.items.map((i) => Object.assign({}, i, { id: '' })) }));
      return strip(this.cv) === strip(CoverArt.DEFAULT);
    }
    theme() { return CoverArt.theme({ child: Object.assign({}, this.child, { cv: this.cv }), cover: this.child.cover }); }

    /* ---------- riwayat ---------- */
    push(key) {
      const now = performance.now();
      if (!(key && key === this.lastKey && now - this.lastT < 900)) { this.hist.push(this.snap()); if (this.hist.length > 80) this.hist.shift(); }
      this.fut.length = 0; this.lastKey = key || ''; this.lastT = now;
    }
    apply(fn, struct) { fn(this.cv); this.changed(struct); }
    /** ganti seluruh desain (tata letak siap pakai, kembalikan ke awal) sebagai satu langkah yang bisa diurungkan */
    replaceCv(cv) {
      this.push(''); this.cv = cv;
      if (this.sel && !this.item(this.sel)) { this.sel = null; this.crop = false; this.emit('select', 'replace'); }
      this.changed(true);
    }
    edit(fn, key, struct) { this.push(key); this.apply(fn, struct); }
    changed(struct) {
      CoverArt.warm(this.cv, () => this.scheduleDraw());
      this.scheduleDraw(); this.emit('change');
      if (struct) this.emit('struct');
    }
    undo() { if (!this.hist.length) return false; this.fut.push(this.snap()); this.cv = JSON.parse(this.hist.pop()); this.afterJump(); return true; }
    redo() { if (!this.fut.length) return false; this.hist.push(this.snap()); this.cv = JSON.parse(this.fut.pop()); this.afterJump(); return true; }
    afterJump() { this.lastKey = ''; if (this.sel && !this.item(this.sel)) { this.sel = null; this.crop = false; this.emit('select', 'undo'); } this.changed(true); }

    /* ---------- barang ---------- */
    canAdd(t) {
      if (this.cv.items.length >= CoverArt.MAX_ITEMS) return 'Satu sampul memuat paling banyak ' + CoverArt.MAX_ITEMS + ' barang. Hapus beberapa lebih dulu.';
      if (t === 'photo' && this.count('photo') >= CoverArt.MAX_PHOTOS) return 'Satu sampul memuat paling banyak ' + CoverArt.MAX_PHOTOS + ' foto.';
      if (t === 'name' && this.count('name') >= 1) return 'Nama anak sudah ada di sampul.';
      return '';
    }
    add(it) {
      const why = this.canAdd(it.t); if (why) { UI.toast(why); return null; }
      it.id = it.id || uid(8);
      this.edit((cv) => { cv.items.push(it); }, '', false);

    }
    remove(id) {
      if (!this.item(id)) return;

      if (this.sel === id) this.setSel(null, 'remove');

    }
    duplicate(id) {
      const it = this.item(id); if (!it) return null;
      if (it.t === 'name') { UI.toast('Nama anak hanya boleh satu di sampul.'); return null; }
      if (isBleed(it)) { UI.toast('Foto yang memenuhi sampul tidak bisa digandakan.'); return null; }
      const why = this.canAdd(it.t); if (why) { UI.toast(why); return null; }
      const c = clone(it); c.id = uid(8); c.x = clamp(r1(c.x + 36), 24, DW - 24); c.y = clamp(r1(c.y + 36), 24, DH - 24);
      this.edit((cv) => { cv.items.push(c); }, '', false);
      this.setSel(c.id, 'add'); this.emit('struct');
      return c.id;
    }
    /** how: 'up' (ke depan satu), 'down' (ke belakang satu), 'front', 'back' */
    order(id, how) {
      const L = this.cv.items, i = L.findIndex((x) => x.id === id); if (i < 0) return;
      const j = how === 'up' ? i + 1 : how === 'down' ? i - 1 : how === 'front' ? L.length - 1 : 0;
      if (j < 0 || j >= L.length || j === i) return;
      this.edit((cv) => { const a = cv.items.splice(i, 1)[0]; cv.items.splice(j, 0, a); }, '', true);

    /* ---------- kanvas ---------- */
    scheduleDraw() { if (this.raf || this.closed) return; this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); }); }
    model() { return { child: Object.assign({}, this.child, { cv: this.cv }), cover: this.child.cover, edit: true }; }
    draw() {
      const d = this.dom; if (!d || !this.view.pw || this.closed) return;
      try { CoverArt.front('color', this.model(), [this.view.pw, this.view.ph], d.canvas); } catch (e) { console.error('studio sampul', e); }
      this.placeOverlay();
    }
    /** ukuran kanvas rancang mengikuti ruang yang tersedia (piksel CSS) */

      const ratio = DH / DW; let w = Math.min(availW, availH / ratio); w = Math.max(120, Math.floor(w));
      const hh = Math.round(w * ratio), dpr = Math.min(window.devicePixelRatio || 1, 2);
      const pw = clamp(Math.round(w * dpr), 240, 1024), ph = Math.round(pw * ratio);

      Object.assign(this.view, { cssW: w, cssH: hh, k: w / DW, pw, ph });
      this.dom.view.style.width = w + 'px'; this.dom.view.style.height = hh + 'px';

    }
    placeOverlay() {
      const d = this.dom; if (!d) return;

      const x = bleed ? DW / 2 * k : it.x * k, y = bleed ? DH / 2 * k : it.y * k, rot = bleed ? 0 : it.r;
      d.ov.hidden = false;
      d.ov.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + rot + 'deg)';
      d.box.style.width = w.toFixed(1) + 'px'; d.box.style.height = hh.toFixed(1) + 'px';
      d.box.style.margin = (-hh / 2).toFixed(1) + 'px 0 0 ' + (-w / 2).toFixed(1) + 'px';

        const b = CoverArt.itemBox(it), l = this.toLocal(it, px, py), pad = 8 / (k * it.s);

      const sc = Math.max(sh.w / iw, sh.h / ih) * it.z, mx = sh.w / sc / 2 / iw, my = sh.h / sc / 2 / ih;

        }

        if (hd && sel && !isBleed(sel)) {

          g = { type: hd.dataset.h, id: sel.id, cx, cy, d0: Math.max(12, Math.hypot(e.clientX - cx, e.clientY - cy)), a0: Math.atan2(e.clientY - cy, e.clientX - cx) / RAD, s0: sel.s, r0: sel.r, started: false };

        }
        const it = ss.hit(p.x, p.y);

        const was = ss.sel === it.id;
        if (!was) ss.select(it.id, 'canvas');
        g = { type: 'move', id: it.id, ox: it.x - p.x, oy: it.y - p.y, lx: p.x, ly: p.y, sx: e.clientX, sy: e.clientY, started: false, was };
        e.preventDefault();
      });

      view.addEventListener('pointermove', (e) => {
        const q = pts.get(e.pointerId); if (!q) return;
        q.x = e.clientX; q.y = e.clientY;
        if (!g) return;
        if (g.type === 'pinch') {
          if (pts.size !== 2) return;
          const t = two(), it = ss.item(g.id); if (!it) return;
          if (!g.started) { if (Math.abs(t.d - g.d0) < 4 && Math.abs(t.ang - g.a0) < 2) return; g.started = true; ss.push('pinch:' + g.id); }
          ss.apply((cv) => { const m = cv.items.find((i) => i.id === g.id); if (!m) return; m.s = r3(clamp(g.s0 * t.d / g.d0, 0.15, 4)); m.r = r1(normAng(g.r0 + t.ang - g.a0)); });
          return;
        }
        if (pts.size !== 1) return;
        const p = toDesign(e), it = ss.item(g.id);
        if (g.type === 'move') {
          if (!it) return;
          if (!g.started) { if (Math.hypot(e.clientX - g.sx, e.clientY - g.sy) < 4) return; g.started = true; ss.push('move:' + g.id); }
          if (isBleed(it) || (ss.crop && it.t === 'photo' && it.ph)) {

            ss.apply((cv) => { const m = cv.items.find((i) => i.id === g.id); if (m) ss.cropPan(m, dx, dy); });

          }

          ss.apply((cv) => { const m = cv.items.find((i) => i.id === g.id); if (m) { m.x = r1(nx); m.y = r1(ny); } });
        } else if (g.type === 'scale') {
          if (!it) return;
          if (!g.started) { g.started = true; ss.push('scale:' + g.id); }

          ss.apply((cv) => { const m = cv.items.find((i) => i.id === g.id); if (m) m.s = r3(clamp(g.s0 * d / g.d0, 0.15, 4)); });

      view.addEventListener('pointerup', (e) => end(e, false));

          else ss.edit((cv) => { const m = cv.items.find((i) => i.id === it.id); if (m) { m.x = r1(clamp(m.x + dx, 24, DW - 24)); m.y = r1(clamp(m.y + dy, 24, DH - 24)); } }, 'key:' + it.id);

/* ===== 69-cvs-panels.js ===== */
/* Studio sampul, panel pilihan: Letak, Dasar, Teks, Foto, Stiker. Tiap panel menerima `host`
   { ss: sesi, askPhoto(anchor, cb, title), placePhoto(ph), ink(): warna teks sekunder, reg(fn): daftarkan penyelaras nilai } dan mengembalikan elemen. */

(() => {
  const CA = CoverArt;
  const { DW, DH } = CA;
  const isBleed = (it) => CoverStudio.isBleed(it);
  const STK_COLORS = ['#e86f8a', '#f2b84b', '#5bb98c', '#4e86b8', '#9a86c9', '#c4622d', '#1e1f24', '#fbf7ee'];

  /* ---------- pembangun kecil ---------- */
  const sec = (title, ...kids) => h('section.cvs-sec', title ? h('h3', title) : null, ...kids);
  const note = (text) => h('p.cvs-note', text);

  function chips(items, value, onPick, label) {
    const g = h('div.cvs-chips', { role: 'radiogroup', 'aria-label': label });
    items.forEach((it) => {
      const b = h('button.chip.btnlike', {
        type: 'button', role: 'radio', 'aria-checked': String(it.k === value), title: it.title || null, style: it.style || null,
        onclick: () => { $$('button', g).forEach((x) => x.setAttribute('aria-checked', String(x === b))); onPick(it.k); },
      }, it.canvas || null, it.t);
      g.appendChild(b);
    });
    return g;
  }
  /** kotak contoh (warna atau gambar kecil) yang bisa dipilih */
  function swatches(items, value, onPick, label, cls) {
    const g = h('div.cvs-sws' + (cls ? '.' + cls : ''), { role: 'radiogroup', 'aria-label': label });
    items.forEach((it) => {
      const b = h('button.cvs-sw', {
        type: 'button', role: 'radio', 'aria-checked': String(it.k === value), 'aria-label': it.t, title: it.t, style: it.bg ? { background: it.bg } : null,
        onclick: () => { $$('button', g).forEach((x) => x.setAttribute('aria-checked', String(x === b))); onPick(it.k); },
      }, it.canvas || null, it.cap ? h('span.cap', it.cap) : null);
      g.appendChild(b);
    });
    return g;
  }
  function range(label, min, max, step, value, onInput, fmt) {
    const out = h('output'), inp = h('input', { type: 'range', min, max, step, value, 'aria-label': label });
    const show = () => { out.textContent = fmt ? fmt(+inp.value) : String(inp.value); };
    inp.addEventListener('input', () => { show(); onInput(+inp.value); });
    const el = h('label.cvs-range', h('span', label), inp, out);
    el.set = (v) => { if (document.activeElement !== inp) inp.value = v; show(); };
    el.input = inp; show(); return el;
  }
  /** pemilih warna bebas (kotak warna bawaan peramban) */
  function colorPick(label, value, onInput, onChange) {
    const inp = h('input', { type: 'color', value: /^#[0-9a-f]{6}$/i.test(value) ? value : '#888888', 'aria-label': label });
    inp.addEventListener('input', () => onInput(inp.value.toLowerCase()));
    if (onChange) inp.addEventListener('change', () => onChange(inp.value.toLowerCase()));
    const el = h('label.cvs-color', inp, h('span', label)); el.input = inp; return el;
  }
  const fontChips = (value, onPick, label) => chips(Object.keys(CA.FONTS).map((k) => {
    const f = CA.FONTS[k]; return { k, t: f.name, style: { fontFamily: f.css, fontWeight: f.w, fontStyle: f.st || 'normal' } };
  }), value, onPick, label);

  const ofType = (ss, t) => ss.cv.items.filter((i) => i.t === t);
  const upd = (ss, id, fn, key, struct) => ss.edit((cv) => { const m = cv.items.find((i) => i.id === id); if (m) fn(m); }, key ? key + ':' + id : '', !!struct);

  /** pengatur ukuran dan putaran untuk barang terpilih */
  function sizeRot(host, it) {
    const ss = host.ss;
    const sz = range('Ukuran', 15, 400, 1, Math.round(it.s * 100), (v) => upd(ss, it.id, (m) => { m.s = v / 100; }, 'size'), (v) => v + '%');
    const rt = range('Putar', -180, 180, 1, Math.round(it.r), (v) => upd(ss, it.id, (m) => { m.r = v; }, 'rot'), (v) => v + '°');
    host.reg(() => { const m = ss.item(it.id); if (m) { sz.set(Math.round(m.s * 100)); rt.set(Math.round(m.r)); } });
    return h('div.cvs-two', sz, rt);
  }

  /** gambar mungil sampul. o.edit menampilkan bingkai foto kosong sebagai ajakan memilih foto */
  CoverStudio.thumb = function (child, w, o) {
    o = o || {}; const hgt = Math.round(w * DH / DW), dpr = Math.min(window.devicePixelRatio || 1, 2), pw = Math.round(w * dpr), ph = Math.round(hgt * dpr);
    const c = h('canvas.cvs-thumb', { width: pw, height: ph, role: 'img', 'aria-label': o.label || 'Sampul buku ' + (child.nick || child.name || ''), style: { width: w + 'px', height: hgt + 'px' } });
    const paint = () => { try { CA.front('color', { child, cover: child.cover, edit: !!o.edit }, [pw, ph], c); } catch (e) { console.error(e); } };
    paint(); if (child.cv) CA.warm(child.cv, paint);
    return c;
  };

  const labelOf = (ss, it) => {
    if (it.t === 'name') return 'Nama anak';
    if (it.t === 'photo') { const n = ofType(ss, 'photo').findIndex((x) => x.id === it.id) + 1; return 'Foto ' + n + ' · ' + (CA.SHAPE[it.shape] || CA.SHAPE.oval).name; }
    if (it.t === 'sticker') { const d = CA.STK.get(it.k); return 'Stiker ' + (d ? d.name.toLowerCase() : it.k); }
    return 'Teks “' + (it.text || '').slice(0, 18) + '”';
  };
  const iconOf = (it) => (it.t === 'name' ? 'tag' : it.t === 'photo' ? 'image' : it.t === 'sticker' ? 'star' : 'edit');

  const PANELS = {};

  /* ======================= LETAK ======================= */
  PANELS.letak = function (host) {
    const ss = host.ss, ph = ss.firstPh(), root = h('div.cvs-pane');
    const apply = (p, phNew) => { ss.replaceCv(CA.applyPreset(ss.cv, p.k, phNew)); UI.toast('Susunan “' + p.name + '” dipakai. Bisa diurungkan.'); };
    const choose = (p, anchor) => {
      const needs = p.k !== 'klasik' && p.k !== 'polos';
      if (needs && !ss.hasPhoto()) host.askPhoto(anchor, (np) => apply(p, np), 'Pilih foto untuk susunan “' + p.name + '”');
      else apply(p, ss.firstPh());
    };
    /* gambar susunan di-cache selama desain tidak berubah supaya berpindah tab terasa ringan */
    const ck = ss.snap();
    if (!ss._presets || ss._presets.key !== ck) {
      const cache = {};
      CA.PRESETS.forEach((p) => {
        const needs = p.k !== 'klasik' && p.k !== 'polos', cvp = CA.applyPreset(ss.cv, p.k, ph);
        cache[p.k] = CoverStudio.thumb(Object.assign({}, ss.child, { cv: cvp }), 92, { edit: needs && !ph, label: 'Susunan ' + p.name });
      });
      ss._presets = { key: ck, cache };
    }

    const tb = (ic, label, fn, cls) => h('button.btn.sm.quiet' + (cls ? '.' + cls : ''), { type: 'button', title: label, 'aria-label': label, onclick: fn }, icon(ic, 17), h('span.t', label));
    const bDup = tb('copy', 'Gandakan', () => ss.sel && ss.duplicate(ss.sel));

/* Ekspor buku ke PDF.
   Halaman digambar di kanvas dengan pelukis halaman yang sama dengan buku (Pages.kit), diubah ke JPEG, lalu dirangkai oleh penulis PDF
   kecil di bawah (tanpa pustaka luar). Diorama difoto dari adegan 3D yang sama dengan buku; foto dan gambar sampul video dimuat dari
   penyimpanan tersandi. Berkas hasilnya TIDAK tersandi, jadi modul ini hanya berjalan atas permintaan pemakai (Dasbor > Cadangan).
   Urutan halaman: sampul, judul, persembahan, [lema: teks (bisa bersambung), diorama, foto dan video], daftar lema, sampul belakang. */

const Pdf = (() => {
  const F = Pages.FONT, kit = Pages.kit;
  const SIZES = { a5: { name: 'A5', mm: 148, px: 1280, mb: 0.26 }, a4: { name: 'A4', mm: 210, px: 1536, mb: 0.36 } };
  const DW = 1024, DH = 1440, MX0 = 100, MX1 = DW - 100, CW = MX1 - MX0, FOOT = DH - 74, LBL = 188, Y_NEXT = 450;
  const PT = 72 / 25.4, JPEG_Q = 0.84, MAXPH = 6, IDX1 = 18, IDX2 = 23;
  const STILL = { x: 62, y: 96, w: 900, h: 850 };
  const enc = new TextEncoder();
  const cancelErr = () => Object.assign(new Error('Dibatalkan.'), { code: 'cancelled' });
  const n2 = (v) => String(Math.round(v * 100) / 100);
  const hex16 = (s) => { let o = 'FEFF'; for (let i = 0; i < s.length; i++) o += s.charCodeAt(i).toString(16).padStart(4, '0'); return '<' + o.toUpperCase() + '>'; };
  const pdfDate = (d) => {
    const p = (n) => String(n).padStart(2, '0'), o = -d.getTimezoneOffset(), a = Math.abs(o);
    return 'D:' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + (o < 0 ? '-' : '+') + p(Math.floor(a / 60)) + "'" + p(a % 60) + "'";
  };
  const slug = (s) => String(s || 'anak').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'anak';
  const mmss = (s) => { s = Math.max(0, Math.round(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  /* ================= penulis PDF ================= */
  function Writer() {
    let parts = [], pos = 0; const off = [];
    const put = (u8) => { parts.push(u8); pos += u8.length; };
    const str = (s) => put(enc.encode(s));
    put(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
    return {
      obj(id, body) { off[id] = pos; str(id + ' 0 obj\n' + body + '\nendobj\n'); },
      stream(id, dict, bytes) { off[id] = pos; str(id + ' 0 obj\n<< ' + dict + ' /Length ' + bytes.length + ' >>\nstream\n'); put(bytes); str('\nendstream\nendobj\n'); },
      squash() { if (parts.length > 48) parts = [new Blob(parts)]; },
      finish(total, root, info) {
        const at = pos; let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
        for (let i = 1; i < total; i++) { if (off[i] == null) throw new Error('Objek PDF ' + i + ' hilang.'); x += String(off[i]).padStart(10, '0') + ' 00000 n \n'; }
        const idb = new Uint8Array(16); crypto.getRandomValues(idb); const id = Array.from(idb, (b) => b.toString(16).padStart(2, '0')).join('');
        x += 'trailer\n<< /Size ' + total + ' /Root ' + root + ' 0 R /Info ' + info + ' 0 R /ID [<' + id + '> <' + id + '>] >>\nstartxref\n' + at + '\n%%EOF\n';
        str(x); return new Blob(parts, { type: 'application/pdf' });
      },
    };
  }
  /** o: { pages, marks:[{title,page}], wPt, hPt, title, author } */
  function Doc(o) {
    const W = Writer(), m = o.marks.length, base = 5 + m, pid = (i) => base + i * 3; let added = 0;
    return {
      addPage(i, jpeg, pw, ph) {
        const p = pid(i);
        W.obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + n2(o.wPt) + ' ' + n2(o.hPt) + '] /Resources << /XObject << /Im0 ' + (p + 2) + ' 0 R >> >> /Contents ' + (p + 1) + ' 0 R >>');
        W.stream(p + 1, '', enc.encode('q ' + n2(o.wPt) + ' 0 0 ' + n2(o.hPt) + ' 0 0 cm /Im0 Do Q'));
        W.stream(p + 2, '/Type /XObject /Subtype /Image /Width ' + pw + ' /Height ' + ph + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode', jpeg);
        added++; W.squash();

      close() {

        W.obj(4, '<< /Type /Outlines' + (m ? ' /First 5 0 R /Last ' + (4 + m) + ' 0 R /Count ' + m : '') + ' >>');
        o.marks.forEach((mk, j) => { const id = 5 + j; W.obj(id, '<< /Title ' + hex16(mk.title) + ' /Parent 4 0 R' + (j ? ' /Prev ' + (id - 1) + ' 0 R' : '') + (j < m - 1 ? ' /Next ' + (id + 1) + ' 0 R' : '') + ' /Dest [' + pid(mk.page) + ' 0 R /Fit] >>'); });
        W.obj(2, '<< /Type /Pages /Count ' + o.pages + ' /Kids [' + Array.from({ length: o.pages }, (_, i) => pid(i) + ' 0 R').join(' ') + '] >>');
        W.obj(1, '<< /Type /Catalog /Pages 2 0 R /Outlines 4 0 R /PageMode /UseOutlines /Lang (id) /ViewerPreferences << /DisplayDocTitle true >> >>');
        W.obj(3, '<< /Title ' + hex16(o.title) + ' /Author ' + hex16(o.author) + ' /Creator ' + hex16('Ensiklopedia Kenangan Anak') + ' /Producer ' + hex16('Ensiklopedia Kenangan Anak') + ' /CreationDate (' + pdfDate(new Date()) + ') >>');
        return W.finish(base + o.pages * 3, 1, 3);
      },
    };
  }

  /* ================= tata letak teks ================= */
  /** semua baris sebuah teks (paragraf, huruf awal besar opsional); sama dengan Pages.flow tetapi tanpa memotong */
  function rowsOf(ctx, text, o) {
    const paras = String(text || '').replace(/\r/g, '').split('\n').map((s) => s.trim());
    let dropCh = '', capW = 0;
    if (o.drop) {
      const first = paras.findIndex((p) => p.length);

        let x0 = 9, x1 = -9, y0 = 9, y1 = -9; pts.forEach((p) => { q.copy(p).project(cam); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); });

        target.addScaledVector(right, ((x0 + x1) / 2) * dist * tf * cam.aspect).addScaledVector(up, ((y0 + y1) / 2) * dist * tf);
        dist *= Math.max((x1 - x0) / 2, (y1 - y0) / 2) / 0.95;
      }
      cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target); cam.updateMatrixWorld(true); cam.updateProjectionMatrix();
    },
    async shoot(mem, child, w, h) {
      let inst = null;
      try {
        inst = Dio.build(mem, { child }); this.tmp.add(inst.group); inst.setPop(1);
        GFX.setDial(inst.light, 0); GFX.applyDialCur(); inst.applyLamp();
        const photos = mem.photos || [];
        inst.frames.forEach((fr, i) => { if (!photos[i]) fr.visible = false; }); /* bingkai kosong ("foto") tidak ikut tercetak */
        await Promise.all(inst.frames.map((fr, i) => {
          const ph = photos[i]; if (!ph) return null;
          const put = (t) => { if (t) fr.userData.setTexture(t); };
          return Photos3D.full(ph).then(put).catch(() => Photos3D.thumb(ph).then(put).catch(() => {}));
        }));
        inst.group.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(inst.group);
        return GFX.still(w, h, (cam) => Stage.frame(cam, box));
      } finally { if (inst) { try { inst.dispose(); } catch (e) { console.error(e); } } if (GFX.lights && GFX.lights.dio) GFX.lights.dio.intensity = 0; }
    },
  };

  /* ================= bahan halaman ================= */
  async function warmCover(model) {
    const ch = model.child; if (!ch.cv) return;
    for (let i = 0; i < 80; i++) {
      CoverArt.warm(ch.cv, () => {});
      const k = CoverArt.key(model, [64, 90]).split('|'), n = k.length; /* ... | keadaan foto | keadaan huruf | 'e' atau '' */
      if (!/0/.test(k[n - 3] || '') && !/0/.test(k[n - 2] || '')) return;
      await sleep(120);
    }
  }
  async function loadMedia(list, M) {
    return Promise.all(list.map(async (ph) => {
      const it = { ph, vid: S.isVideo(ph), cap: String(ph.cap || '').trim(), bmp: null, w: 0, h: 0, dur: ph.vid && ph.vid.dur };
      try { it.bmp = await decodeFile(await S.photoBlob(ph)); }
      catch (e) { try { const u = S.thumbURL(ph); if (!u) throw e; it.bmp = await loadImg(u); } catch (e2) { M.missing++; } }
      if (it.bmp) { it.w = it.bmp.width || it.bmp.naturalWidth; it.h = it.bmp.height || it.bmp.naturalHeight; }
      return it;
    }));
  }
  const toJpeg = async (cv) => {
    const b = await new Promise((res) => cv.toBlob(res, 'image/jpeg', JPEG_Q));
    if (!b) throw new Error('Halaman tidak dapat diubah menjadi gambar. Memori perangkat mungkin kurang.');
    return new Uint8Array(await b.arrayBuffer());
  };
  async function paintPage(d, M, stage) {
    switch (d.kind) {
      case 'cover': return CoverArt.front('color', M.model, M.sz);
      case 'back': return CoverArt.back('color', M.model, M.sz);
      case 'title': return Pages.render({ kind: 'title' }, M.model, M.sz).canvas;
      case 'plaque': return Pages.render({ kind: 'endpaper', side: 'front' }, M.model, M.sz).canvas;
      case 'text': return paintText(d, M);
      case 'index': return paintIndex(d, M);
      case 'plate': {
        d.img = null;
        if (stage) { try { d.img = await Stage.shoot(d.mem, M.child, Math.round(STILL.w * M.k), Math.round(STILL.h * M.k)); } catch (e) { console.error(e); } }
        if (!d.img) M.noDio++;
        try { return paintPlate(d, M); } finally { if (d.img) { d.img.width = d.img.height = 0; d.img = null; } }
      }
      case 'media': {
        d.items = await loadMedia(d.photos, M);
        try { return paintMedia(d, M); } finally { d.items.forEach((it) => { if (it.bmp && it.bmp.close) { try { it.bmp.close(); } catch (e) { /* abaikan */ } } }); d.items = null; }
      }
      default: throw new Error('Jenis halaman tidak dikenal: ' + d.kind);
    }
  }
  function labelOf(d, total, nMem) {
    switch (d.kind) {
      case 'cover': return 'Sampul depan';
      case 'title': return 'Halaman judul';
      case 'plaque': return 'Halaman persembahan';
      case 'text': return 'Lema ' + d.no + ' dari ' + nMem + ': ' + (d.mem.title || 'Tanpa judul');
      case 'plate': return 'Memotret diorama ' + d.no + ' dari ' + nMem;
      case 'media': return 'Foto dan video lema ' + d.no + ' dari ' + nMem;
      case 'index': return 'Daftar lema';
      default: return 'Sampul belakang';
    }
  }

  /* ================= membuat berkas ================= */
  /** opt: { childId, size:'a5'|'a4', dio, photos, onProgress(fraksi, teks), isCancelled() } -> { blob, pages, bytes, missing, noDio, name, size } */
  async function make(opt) {
    const sz = SIZES[opt.size] || SIZES.a5, PX = sz.px, PY = Math.round(PX * DH / DW), child = S.children.get(opt.childId);
    if (!child) throw Object.assign(new Error('Profil anak tidak ditemukan.'), { code: 'nochild' });
    const model = modelFor(child, opt);
    if (!model.mems.length) throw Object.assign(new Error('Belum ada lema terbit untuk anak ini.'), { code: 'empty' });
    const rep = opt.onProgress || (() => {}), stopped = () => !!(opt.isCancelled && opt.isCancelled());
    const M = { kit, model, child, sz: [PX, PY], k: PX / DW, missing: 0, noDio: 0 };
    rep(0, 'Memuat huruf dan sampul…');
    await Pages.fonts(); await warmCover(model);
    if (stopped()) throw cancelErr();
    const plan = buildPlan(M, opt), total = plan.pages.length, nMem = model.mems.length;
    const doc = Doc({ pages: total, marks: plan.marks, wPt: sz.mm * PT, hPt: sz.mm * PT * DH / DW, title: 'Ensiklopedia Kenangan ' + (child.nick || child.name || ''), author: S.familyName || 'Keluarga' });
    let stage = false, blob = null;
    try {
      stage = opt.dio ? Stage.begin() : false;
      for (let i = 0; i < total; i++) {
        if (stopped()) throw cancelErr();
        const d = plan.pages[i]; rep(i / total * 0.97, 'Halaman ' + (i + 1) + ' dari ' + total + ' · ' + labelOf(d, total, nMem));
        const cv = await paintPage(d, M, stage), jpg = await toJpeg(cv); cv.width = cv.height = 0;
        doc.addPage(i, jpg, PX, PY); await sleep(6);
      }
      rep(0.98, 'Merangkai berkas…'); blob = doc.close();
    } finally { Stage.end(); }
    return { blob, pages: total, bytes: blob.size, missing: M.missing, noDio: M.noDio, wantDio: !!opt.dio, size: sz.name, name: 'kenangan-buku-' + slug(child.nick || child.name) + '-' + todayYmd() + '.pdf', lemas: nMem };
  }

  /* ================= antarmuka ================= */
  let running = false;
  async function run(opt) {
    running = true; let cancel = false;
    const text = h('span', { style: { color: 'var(--ink-2)' } }, 'Menyiapkan…'), bar = h('div.bar', h('i', { style: { width: '0%' } }));
    const m = UI.modal({
      title: 'Menyusun buku PDF', size: 'sm', dismissible: false,
      body: h('div.stack', h('div.row', { style: { gap: '12px' } }, h('span.spin', { style: { color: 'var(--indigo)' } }), text), bar,
        h('p.faint.small', { style: { margin: 0 } }, 'Biarkan halaman ini tetap terbuka sampai selesai. Diorama difoto satu per satu, jadi layar buku akan diam sebentar.')),
      actions: [{ id: 'cancel', label: 'Batal', onclick: (mm) => { cancel = true; mm.btn('cancel').disabled = true; text.textContent = 'Membatalkan…'; } }],
    });
    try {
      const res = await make(Object.assign({}, opt, { isCancelled: () => cancel, onProgress: (f, t) => { bar.firstChild.style.width = Math.round(clamp(f, 0, 1) * 100) + '%'; if (t) text.textContent = t; } }));
      m.close(); showReady(res);
    } catch (e) {
      m.close();
      if (e && e.code === 'cancelled') UI.toast('Pembuatan PDF dibatalkan.');
      else UI.fail(e, 'Buku PDF belum bisa dibuat.');
    } finally { running = false; }
  }
  function showReady(res) {
    const notes = [];
    if (res.wantDio && res.noDio) notes.push(res.noDio + ' diorama diganti panel polos karena gambar 3D tidak tersedia.');
    if (res.missing) notes.push(res.missing + ' foto tidak dapat dimuat dan ditandai kosong.');
    const m = UI.modal({
      title: 'Buku PDF siap', size: 'sm',
      body: h('div.stack',
        h('p', { style: { margin: 0, lineHeight: 1.55, color: 'var(--ink-2)' } }, res.lemas + ' lema dalam ' + res.pages + ' halaman ' + res.size + ', ukuran ' + bytesText(res.bytes) + '.'),
        notes.length ? UI.notice('warn', notes.join(' ')) : null,
        UI.notice('', 'Berkas ini tidak tersandikan. Siapa pun yang memegangnya bisa membaca semua isinya, jadi simpan dan bagikan dengan hati-hati.', 'lock')),
      actions: [
        { label: 'Tutup', onclick: (mm) => mm.close() },
        { id: 'save', label: 'Simpan PDF', kind: 'primary', icon: 'download', onclick: async (mm) => { mm.setBusy(true); const ok = await Manage.save(res.name, res.blob, 'PDF disimpan (' + bytesText(res.bytes) + ').'); mm.setBusy(false); if (ok) mm.close(); } },
      ],
    });
    return m;
  }
  /** dialog pilihan: anak, ukuran halaman, isi */
  function start() {
    if (running) { UI.toast('Buku PDF sedang disusun.'); return null; }
    if (!S.caps || !S.caps.downloads) { UI.toast('Menyimpan berkas tidak tersedia di tampilan ini.'); return null; }
    const kids = S.childList().map((c) => ({ c, n: S.activeMemories(c.id).filter((m) => m.status !== 'draf').length }));
    if (!kids.length) { UI.toast('Belum ada profil anak.'); return null; }
    const def = (kids.find((k) => k.c.id === App.childId && k.n) || kids.find((k) => k.n) || kids[0]).c.id;
    const sel = UI.select(kids.map((k) => ({ v: k.c.id, t: (k.c.nick || k.c.name || 'Anak') + ' (' + k.n + ' lema terbit)' })), def, { 'aria-label': 'Anak' });
    const size = UI.seg([{ v: 'a5', t: 'A5 (buku kecil)' }, { v: 'a4', t: 'A4 (lebih besar)' }], 'a5', () => upd(), { label: 'Ukuran halaman' });
    const canDio = !!(typeof GFX !== 'undefined' && GFX.ok);
    const dio = h('input', { type: 'checkbox', checked: canDio, disabled: !canDio }), pho = h('input', { type: 'checkbox', checked: true });
    const est = h('p.faint.small', { style: { margin: 0 }, 'aria-live': 'polite' });
    const upd = () => {
      let e = null; try { e = estimate(sel.value, { size: size.value, dio: dio.checked, photos: pho.checked }); } catch (er) { console.error(er); }
      est.textContent = !e ? '' : e.empty ? 'Anak ini belum punya lema terbit.' : 'Sekitar ' + e.pages + ' halaman, perkiraan ukuran ' + Math.max(1, Math.round(e.mb)) + ' MB.';
      if (go) go.disabled = !e || e.empty;
    };
    let go = null;
    const m = UI.modal({
      title: 'Buat buku PDF', size: 'sm',
      body: h('div.stack', { style: { gap: '14px' } },
        h('p', { style: { margin: 0, lineHeight: 1.55, color: 'var(--ink-2)' } }, 'Susunan buku yang sama dengan di layar: sampul, halaman judul, tiap lema dengan dioramanya, foto, dan daftar lema. Siap dicetak atau dikirim.'),
        UI.field('Anak', sel), UI.field('Ukuran halaman', size),
        h('div.stack', { style: { gap: '8px' } },
          h('label.check', dio, h('span', 'Sertakan gambar diorama 3D', canDio ? null : h('small.faint', ' (tidak tersedia di perangkat ini)'))),
          h('label.check', pho, h('span', 'Sertakan foto dan gambar sampul video'))),
        est,
        UI.notice('warn', 'PDF tidak tersandikan. Isinya bisa dibaca siapa pun yang memegang berkasnya, jadi simpan dan bagikan dengan hati-hati. Video tidak ikut diputar; yang tampil gambar sampulnya.')),
      actions: [{ label: 'Batal', onclick: (mm) => mm.close() }, { id: 'go', label: 'Buat PDF', kind: 'primary', icon: 'file', onclick: (mm) => { const opt = { childId: sel.value, size: size.value, dio: dio.checked, photos: pho.checked }; mm.close(); setTimeout(() => run(opt), 220); } }],
    });
    go = m.btn('go');
    [sel, dio, pho].forEach((el) => el.addEventListener('change', upd)); upd();
    return m;
  }

  return { start, make, estimate, buildPlan, SIZES, Stage };
})();
